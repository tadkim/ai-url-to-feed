# 푸시·PR마다 하네스 자체 검사(npm test)를 macOS와 Linux에서 돌린다.
# 실제 사이트를 열지 않는다 (가짜 녹화본으로 계획 → 편집 → 내보내기 → 판정 흐름을 본다).
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg·한글 글꼴 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: npm ci
        env:
          HARNESS_SKIP_BROWSER: 1   # 아래에서 시스템 의존성과 함께 설치한다
      - run: npx playwright install --with-deps chromium
      - run: npm test
