<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>녹화 확인</title>
<link rel="stylesheet" href="/ui/base.css">
<script src="/ui/lucide.js"></script>
<style>
  main { max-width: 1240px; margin: 0 auto; padding: 16px 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }
  .full { grid-column: 1 / -1; }
  .note { background: color-mix(in srgb, var(--warn) 10%, transparent); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
  .note b { color: var(--warn); }
  .rec { display: flex; flex-direction: column; gap: 10px; }
  .vids { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 260px)); gap: 14px; }
  .vids figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .vids video { width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; }
  .vids figcaption { font-size: 12px; color: var(--dim); }
  .vids figure.now figcaption b { color: var(--accent); }
  .sheet { max-width: 100%; border-radius: 6px; }
  .assets { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 64px; }
  .a { background: var(--ui-bg); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 34px 1fr; gap: 2px 8px; }
  .a .n { font-weight: 700; font-size: 16px; grid-row: span 3; }
  .a .t { font-size: 12px; color: var(--dim); }
  .a .cue { justify-self: start; padding: 2px 10px; font-size: 12px; }
  .a.changed { outline: 1px solid color-mix(in srgb, var(--warn) 60%, transparent); }
  .seen { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--dim); cursor: pointer; }
  .seen input { accent-color: var(--ok); }
  .actionbar .reject { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .approve { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
</style>
</head>
<body>
<div class="topbar">
  <a id="back" href="/">진행 화면</a>
  <h1 id="title">녹화 확인</h1>
  <span class="grow"></span>
  <span class="hint">AI가 정한 장면 계획과 실제 녹화본을 비교해요</span>
</div>
<main id="main"></main>
<div class="actionbar" id="bar"></div>

<script type="module">
import { $, h, api, toast, sayBox, projectFromPath, modal, nn, icon } from '/ui/common.js';
const P = projectFromPath();
const sec = (x) => `${Math.round(x * 10) / 10}초`;
let D = null;
const seen = new Set();
const players = new Map();   // 녹화 이름 → 지금 영상 요소

function recCard(r) {
  const prev = D.previous?.recordings.find((x) => x.name === r.name) ?? (D.previous && D.previous.recordings.length === 1 && D.recordings.length === 1 ? D.previous.recordings[0] : null);
  const now = h('video', { src: r.video, controls: true, muted: true, playsinline: true, preload: 'metadata' });
  now.addEventListener('timeupdate', () => { if (now.duration && now.currentTime / now.duration > 0.9) markSeen(r.name); });
  players.set(r.name, now);
  const old = prev && h('video', { src: prev.video, controls: true, muted: true, playsinline: true, preload: 'metadata' });
  const both = old && h('button', { onclick: () => { [old, now].forEach((v) => { v.currentTime = 0; v.play(); }); } }, icon('play', 14), ' 이전과 지금 같이 재생');
  const diff = prev ? Math.round((r.duration - prev.duration) * 10) / 10 : null;
  return h('section', { class: 'card rec' },
    h('div', { class: 'row' }, h('b', {}, r.name), h('span', { class: 'hint' }, sec(r.duration)),
      diff != null && h('span', { class: `pill ${diff < 0 ? 'ok' : diff > 0 ? 'warn' : ''}` }, diff === 0 ? '길이 같음' : `이전보다 ${diff > 0 ? '+' : ''}${diff}초`),
      h('span', { class: 'hint' }, `저장 요청 ${r.writes_seen ?? 0}건 · 막은 요청 ${r.writes_blocked ?? 0}건`),
      h('span', { class: 'grow' }),
      h('label', { class: 'seen' }, h('input', { type: 'checkbox', 'data-seen': r.name, checked: seen.has(r.name), onchange: (e) => { if (e.target.checked) seen.add(r.name); else seen.delete(r.name); renderBar(); } }), '끝까지 봤어요')),
    h('div', { class: 'vids', style: `--cols:${old ? 2 : 1}` },
      old && h('figure', {}, old, h('figcaption', {}, `이전 (거절됨) · ${sec(prev.duration)}`)),
      h('figure', { class: 'now' }, now, h('figcaption', {}, h('b', {}, '지금'), ` · ${sec(r.duration)}`))),
    both,
    h('details', {}, h('summary', { class: 'hint', style: 'cursor:pointer' }, `장면 한눈에 보기 (${r.sheet_every}초 간격, 마지막 칸은 끝 장면)`), h('img', { class: 'sheet', src: r.sheet, alt: `${r.name} 장면 모음`, loading: 'lazy' })));
}

function assetList() {
  const prevAssets = D.previous?.plan?.assets ?? [];
  return h('aside', { class: 'card assets' }, h('h2', {}, `에셋 계획 ${D.plan.assets.length}개`),
    D.plan.assets.map((a) => {
      const p = prevAssets.find((x) => x.n === a.n);
      const changed = D.previous && (!p || p.scene !== a.scene || p.type !== a.type || p.layout !== a.layout);
      const src = a.sources?.[0];
      return h('div', { class: `a${changed ? ' changed' : ''}` },
        h('span', { class: 'n' }, nn(a.n)),
        h('span', { class: 't' }, `${a.type === 'video' ? '영상' : `이미지 · 화면 ${{ single: 1, double: 2, triple: 3 }[a.layout] ?? '?'}개`} · ${src ?? ''}`, changed ? h('span', { class: 'warn-text' }, ' · 바뀜') : null),
        h('span', {}, a.scene),
        a.cue != null && players.has(src) && h('button', { class: 'cue', onclick: () => { const v = players.get(src); v.currentTime = Number(a.cue); v.scrollIntoView({ block: 'center', behavior: 'smooth' }); } }, icon('crosshair', 13), ` ${a.cue}초 장면 보기`));
    }),
    D.plan.writes_note && h('p', { class: 'hint', style: 'margin:4px 0 0' }, D.plan.writes_note));
}

function markSeen(name) { if (!seen.has(name)) { seen.add(name); document.querySelectorAll(`[data-seen="${name}"]`).forEach((c) => { c.checked = true; }); renderBar(); } }

function render() {
  players.clear();
  const top = [];
  if (D.previous) top.push(h('div', { class: 'note full' }, h('b', {}, '지난번 요청'), ` "${D.previous.note ?? '(요청 없음)'}" 이후 다시 찍은 녹화예요. 이전과 지금을 나란히 비교해 보세요.`));
  if (D.status.next !== 'APPROVAL_PLAN') top.push(h('div', { class: 'note full' }, h('b', {}, '지금은 승인할 수 없어요'), ' — ', D.status.reason));
  const recs = h('div', { style: 'display:flex;flex-direction:column;gap:14px' }, D.recordings.map(recCard));
  $('#main').replaceChildren(...top, recs, assetList());
  renderBar();
}

const bar = {};
function buildBar() {
  bar.note = h('textarea', { placeholder: '고칠 점을 적어요. 예: 버튼 사이 간격을 절반으로, 스크롤은 사람처럼', 'aria-label': '고칠 점' });
  bar.reject = h('button', { class: 'danger', onclick: () => { const t = bar.note.value.trim(); if (!t) return toast('무엇을 고칠지 적어 주세요', true); decide('reject', { note: t }); } }, icon('pencil-line', 15), ' 거절하고 다시 찍기');
  bar.approve = h('button', { class: 'primary', onclick: () => decide('approve', { hash: D.hash }) }, icon('check', 16), ' 촬영 계획 승인');
  bar.count = h('span', { class: 'hint' });
  $('#bar').replaceChildren(h('div', { class: 'reject' }, h('div', { class: 'row', style: 'flex-wrap:nowrap' }, bar.note, bar.reject)), h('div', { class: 'approve' }, bar.count, bar.approve));
}
function renderBar() {
  if (!bar.approve) buildBar();
  const can = D.status.next === 'APPROVAL_PLAN';
  const all = D.recordings.every((r) => seen.has(r.name));
  bar.note.disabled = !can; bar.reject.disabled = !can;
  bar.approve.disabled = !can || !all;
  bar.count.textContent = `녹화본 확인 ${D.recordings.filter((r) => seen.has(r.name)).length}/${D.recordings.length}${can && !all ? ' · 끝까지 보면 승인할 수 있어요' : ''}`;
}

async function decide(action, body) {
  try {
    await api('POST', `/api/projects/${P}/${action}/plan`, body);
    modal(action === 'approve' ? '촬영 계획을 승인했어요' : '고칠 점을 기록했어요',
      h('p', { style: 'margin:0' }, action === 'approve' ? 'Claude Code에 아래 문장을 말하면 AI가 게시물 파일을 만들어요.' : 'Claude Code에 아래 문장을 말하면 AI가 요청대로 다시 찍어요.'),
      sayBox(`${P} 이어서 해줘`),
      h('div', { class: 'row' }, h('span', { class: 'grow' }), h('a', { href: `/p/${P}/` }, '진행 화면으로')));
    await load();
  } catch (e) { toast(e.message, true); if (/새로고침/.test(e.message)) await load(); }
}

async function load() {
  D = await api('GET', `/api/projects/${P}/compare/plan`);
  if (!D.plan) { $('#main').replaceChildren(h('div', { class: 'empty full' }, '아직 녹화 계획이 없어요. 진행 화면에서 지금 할 일을 확인해 주세요.')); return; }
  $('#title').textContent = `녹화 확인 — ${P}`;
  document.title = `녹화 확인 · ${P}`;
  render();
}
$('#back').href = `/p/${P}/`;
$('#back').prepend(icon('arrow-left', 15), ' ');
load().catch((e) => $('#main').replaceChildren(h('div', { class: 'empty bad-text full' }, e.message)));
</script>
</body>
</html>
