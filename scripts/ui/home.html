<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-url-to-feed</title>
<link rel="stylesheet" href="/ui/base.css">
<script src="/ui/lucide.js"></script>
<style>
  body { background: #f4f4f5; }
  .wrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 20px; padding: 24px 24px 48px; max-width: 1360px; margin: 0 auto; }
  .list { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 70px; align-self: start; }
  .proj { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; }
  .proj.sel { border-color: var(--text); box-shadow: inset 3px 0 0 var(--text); }
  .proj b { font-size: 13px; }
  .proj .u { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .projsel { display: none; }
  .main { display: flex; flex-direction: column; gap: 16px; min-width: 0; max-width: 1080px; }
  .wrap.solo { grid-template-columns: minmax(0, 1fr); max-width: 1000px; padding-top: 36px; }
  .wrap.solo .list { display: none; }
  .topbar .state { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
  .topbar .state.ai { background: var(--ai); color: #fff; } .topbar .state.ok { background: var(--ok); color: #fff; }
  .topbar .state.me { background: var(--accent); color: var(--accent-ink); } .topbar .state.bad { background: var(--bad); color: #fff; }
  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 14px; color: var(--dim); background: none; border: 0; }

  /* ---- 첫 화면: 주소 입력 ---- */
  .hero { max-width: 760px; margin: 0 auto; padding: 72px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 22px; text-align: center; }
  .hero .kicker { background: var(--text); color: var(--accent); font-size: 13px; font-weight: 700; padding: 4px 12px; border-radius: 99px; }
  .hero h2 { font-size: 48px; line-height: 1.25; margin: 0; letter-spacing: -1px; font-weight: 800; }
  .hero .sub { font-size: 17px; color: var(--dim); margin: 0; }
  .start { width: 100%; display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .urlbox { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 2px solid var(--text); border-radius: 16px; padding: 7px 7px 7px 18px; }
  .urlbox input { border: 0; padding: 12px 0; font-size: 19px; font-weight: 600; background: transparent; }
  .urlbox input:focus-visible { outline: none; }
  .urlbox:focus-within { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 60%, transparent); }
  .go { display: inline-flex; align-items: center; gap: 8px; padding: 0 22px; height: 54px; border-radius: 12px; font-size: 17px; font-weight: 800; background: var(--accent); border: 1px solid var(--accent-strong); color: var(--accent-ink); }
  .hint-line { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--dim); padding-left: 4px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .mode { position: relative; display: grid; grid-template-columns: 40px 1fr 22px; gap: 2px 12px; align-items: center; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); cursor: pointer; text-align: left; }
  .mode:has(input:checked) { border: 2px solid var(--text); padding: 13px 15px; }
  .mode input { position: absolute; opacity: 0; pointer-events: none; }
  .mode .mi { grid-row: span 2; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--panel-2); }
  .mode:has(input:checked) .mi { background: var(--accent); }
  .mode b { font-size: 16px; display: flex; gap: 6px; align-items: center; }
  .mode .badge { background: var(--text); color: var(--accent); font-size: 11px; padding: 1px 8px; border-radius: 99px; }
  .mode span.d { font-size: 13px; color: var(--dim); grid-column: 2; }
  .mode .rd { grid-row: 1 / span 2; grid-column: 3; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; }
  .mode .rd .icon { visibility: hidden; }
  .mode:has(input:checked) .rd { background: var(--text); border-color: var(--text); }
  .mode:has(input:checked) .rd .icon { visibility: visible; }
  .flow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; padding-top: 10px; font-size: 14px; font-weight: 600; color: #3f3f46; }
  .flow .n { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--text); color: #fff; font-size: 11px; margin-right: 6px; }
  .ctabar { display: none; }

  /* ---- 프로젝트 ---- */
  .head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .head h2 { margin: 0; font-size: 24px; font-weight: 800; }
  .modebadge { display: inline-flex; align-items: center; gap: 5px; background: var(--text); color: var(--accent); border: 0; border-radius: 99px; padding: 4px 10px 4px 9px; font-size: 12.5px; font-weight: 700; }
  .modebadge .icon:last-child { color: #a1a1aa; }
  .head .note { font-size: 13px; color: #71717a; }
  .newsite { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
  .card2 { background: var(--panel); border: 1px solid #e4e4e7; border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .ptitle { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ptitle h3 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.3; }
  .ptitle .cnt { margin-left: auto; font-size: 15px; font-weight: 700; color: var(--dim); white-space: nowrap; }
  .activity { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-size: 13px; font-weight: 600; color: var(--ai); background: #f5f3ff; border-radius: 99px; padding: 3px 10px; }
  .pbar { height: 10px; border-radius: 99px; background: #e4e4e7; overflow: hidden; }
  .pbar > i { display: block; height: 100%; border-radius: 99px; background: var(--accent-strong); transition: width .3s; }
  .pbar.ai > i { background: var(--ai); } .pbar.bad > i { background: var(--bad); }
  .chips { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 10px; }
  .chip { text-align: left; background: var(--panel); border: 1px solid #e4e4e7; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
  .chip > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .chip .dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); color: #a1a1aa; font-size: 12px; font-weight: 800; flex: none; }
  .chip b { font-size: 14.5px; } .chip span.s { font-size: 12px; color: #71717a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip.done .dot { background: var(--ok); color: #fff; }
  .chip.now { border: 2px solid var(--text); padding: 11px 13px; }
  .chip.now .dot { background: var(--accent); color: var(--text); }
  .chip.working { border: 2px solid var(--ai); background: #f5f3ff; padding: 11px 13px; }
  .chip.working .dot { background: var(--ai); color: #fff; }
  .chip.stopped { border: 2px solid var(--bad); padding: 11px 13px; } .chip.stopped .dot { background: var(--bad); color: #fff; }
  .chip.todo b { color: #71717a; }
  .chip.view { box-shadow: 0 0 0 3px #d4d4d8; }
  .chip .st { display: none; font-size: 11px; font-weight: 700; }
  .todo2 { display: flex; flex-direction: column; gap: 12px; }
  .todo2 .detail { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .todo2 .reason { background: color-mix(in srgb, var(--bad) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-size: 13px; overflow-wrap: anywhere; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0 18px; height: 44px; border-radius: 12px; font-weight: 800; font-size: 15px; text-decoration: none; border: 1px solid var(--accent-strong); background: var(--accent); color: var(--accent-ink); cursor: pointer; white-space: nowrap; }
  .btn.ghost { background: var(--panel); border-color: var(--line); color: var(--text); font-weight: 700; }
  .btn.dark { background: #27272a; border-color: #3f3f46; color: #fafafa; font-weight: 700; }
  a.btn:hover { text-decoration: none; filter: brightness(.97); }
  .tip { display: flex; gap: 8px; align-items: flex-start; padding: 10px 14px; border-radius: 10px; background: #f7fee7; border: 1px solid #d9f99d; font-size: 13px; color: #3f3f46; }
  .tip b { color: var(--accent-strong); }
  .sec-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; } .sec-h h4 { margin: 0; font-size: 18px; } .sec-h .note { font-size: 13px; color: #71717a; }
  .scenes { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 4px; }
  .scene { flex: none; width: 118px; display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--dim); }
  .scene img, .scene .sk { width: 118px; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 8px; border: 1px solid #e4e4e7; background: var(--panel-2); display: grid; place-items: center; }
  .scene .t { font-weight: 700; color: #52525b; }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks .m { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); }
  .checks .m.y { background: var(--ok); border-color: var(--ok); color: #fff; }
  .checks .d { grid-column: 2; color: var(--dim); font-size: 12px; overflow-wrap: anywhere; }
  /* 완성 */
  .donehead { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .okc { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: none; }
  .donehead h3 { margin: 0; font-size: 34px; font-weight: 800; }
  .donehead .s { color: var(--dim); font-size: 15px; }
  .posts { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(120px, calc((100% - 80px) / 6)); gap: 16px; overflow-x: auto; padding-bottom: 4px; }
  .post { position: relative; }
  .post .m { width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; object-fit: cover; background: #000; display: block; }
  .post .lbl { position: absolute; left: 8px; top: 8px; background: var(--text); color: #fff; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 99px; }
  .tweak { display: flex; align-items: center; gap: 16px; padding: 20px 24px; background: #111113; border-radius: 16px; color: #fafafa; flex-wrap: wrap; }
  .tweak .ti { width: 48px; height: 48px; border-radius: 12px; background: #27272a; display: grid; place-items: center; flex: none; }
  .tweak b { font-size: 18px; } .tweak span { color: #a1a1aa; font-size: 14px; }
  .envcard { text-align: left; border-color: color-mix(in srgb, var(--bad) 40%, transparent); }
  .spin { animation: spin 1.2s linear infinite; }

  @media (max-width: 900px) { .chips { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 700px) {
    .wrap { grid-template-columns: 1fr; padding: 14px 14px 120px; gap: 12px; }
    .list { display: none; }
    .projsel { display: flex; } .projsel select { flex: 1; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font: inherit; }
    .topbar .hint { display: none; }
    .hero { padding: 24px 18px 120px; align-items: stretch; text-align: left; gap: 14px; }
    .hero .kicker { align-self: flex-start; font-size: 11px; }
    .hero h2 { font-size: 28px; letter-spacing: -.5px; }
    .hero .sub { font-size: 14px; }
    .urlbox { padding: 4px 14px; border-radius: 12px; } .urlbox input { font-size: 16px; padding: 12px 0; }
    .urlbox .go { display: none; }
    .modes { grid-template-columns: 1fr; gap: 8px; } .mode { padding: 12px 14px; } .mode b { font-size: 15px; }
    .flow { display: none; }
    .ctabar { display: block; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid #e4e4e7; z-index: 30; }
    .ctabar .go { width: 100%; justify-content: center; height: 52px; }
    .head h2 { font-size: 19px; } .head .note { display: none; }
    .wrap.solo { padding-top: 14px; }
    .card2 { padding: 16px; gap: 12px; border-radius: 14px; }
    .ptitle h3 { font-size: 19px; } .ptitle .cnt { font-size: 13px; }
    .chips { grid-template-columns: 1fr; gap: 6px; }
    .chip { flex-direction: row; align-items: center; gap: 10px; padding: 8px 12px; } .chip.now, .chip.working, .chip.stopped { padding: 7px 11px; }
    .chip > div { flex: 1; }
    .chip .st { display: block; margin-left: auto; }
    .chip.done .st { color: var(--ok); } .chip.working .st { color: var(--ai); } .chip.now .st { color: var(--accent-strong); } .chip.todo .st { color: #a1a1aa; }
    .scene, .scene img, .scene .sk { width: 64px; } .scene .x { display: none; }
    .donehead h3 { font-size: 22px; } .okc { width: 40px; height: 40px; }
    .posts { grid-auto-columns: 124px; gap: 10px; }
    .donehead { flex-wrap: nowrap; gap: 12px; } .donehead > div:nth-child(2) { flex: 1; min-width: 0; } .donehead > .grow { display: none; } .donehead .s { font-size: 12.5px; }
    .tweak { padding: 16px; } .tweak .ti { display: none; }
    .stickacts { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid #e4e4e7; z-index: 30; display: flex; flex-direction: column; gap: 8px; }
    .stickacts .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>ai-url-to-feed</h1>
  <span class="grow"></span>
  <span id="state"></span>
  <button class="ghost" id="recheck" hidden title="실행 환경과 사이트 응답을 다시 확인해요">다시 확인</button>
  <a id="help" href="https://github.com/tadkim/ai-url-to-feed#readme" target="_blank" rel="noopener">사용 방법</a>
</div>
<div id="root"></div>

<script type="module">
import { $, h, api, toast, sayBox, projectFromPath, icon } from '/ui/common.js';

let data = null;
let sel = projectFromPath();
let viewStage = null;   // 눌러서 체크 항목을 펼친 단계
let adding = false;     // 사이트가 있어도 주소 입력 화면을 연 상태 (새 사이트)
const MODES = {
  auto: { name: '자동 생성', title: '자동으로 끝까지', desc: '확인·승인 없이 완성까지 · 보통 5~25분', icon: 'sparkles' },
  edit: { name: '편집 모드', title: '만든 뒤 내가 다듬기', desc: '편집 화면에서 구간·속도·배경색을 바꾸고 한 번 확인', icon: 'sliders-horizontal' },
};
const spinIcon = (size, color) => { const el = icon('loader-circle', size); if (el) { el.classList.add('spin'); if (color) el.style.color = color; } return el; };
const ic = (name, size, color) => { const el = icon(name, size); if (el && color) el.style.color = color; return el; };
// 아직 오지 않은 단계에 미리 보여 줄 설명
const STAGE_SUB = { env: '실행 환경 확인', site: '사이트 응답 확인', record: '장면 계획하고 녹화', check: '녹화 훑어보고 승인', make: '구간·속도 정하고 파일 만들기', tune: '편집 화면에서 다듬고 승인', done: '결과 폴더에 저장' };
// 상단 바의 상태 배지
function topState(p) {
  const el = $('#state');
  if (!p) { el.replaceChildren(); el.className = ''; return; }
  const [cls, ico, text] = p.next === 'STOP' ? ['bad', 'triangle-alert', '멈춤'] : p.todo.who === 'done' ? ['ok', 'circle-check', '완성'] : p.todo.who === 'me' ? ['me', 'hand', '내 차례'] : p.todo.since ? ['ai', null, 'AI가 만드는 중'] : ['me', 'terminal', 'Claude Code에 말하기'];
  el.className = `state ${cls}`;
  el.replaceChildren(ico ? icon(ico, 13) : spinIcon(13), text);
}

// ---- 첫 화면: 주소 입력 + 진행 방식 ----
function startForm(big) {
  const input = h('input', { type: 'text', inputmode: 'url', autocapitalize: 'off', autocomplete: 'url', spellcheck: 'false', placeholder: '내사이트.com', 'aria-label': '녹화할 웹사이트 주소 (https:// 없이 넣어도 돼요)' });
  const name = `mode-${Math.random().toString(36).slice(2, 7)}`;
  const modes = h('div', { class: 'modes', role: 'radiogroup', 'aria-label': '진행 방식' }, Object.entries(MODES).map(([k, m]) =>
    h('label', { class: 'mode' }, h('input', { type: 'radio', name, value: k, checked: k === 'auto' }),
      h('span', { class: 'mi' }, icon(m.icon, 20)), h('b', {}, m.title, k === 'auto' ? h('span', { class: 'badge' }, '추천') : null), h('span', { class: 'd' }, m.desc),
      h('span', { class: 'rd' }, ic('check', 13, 'var(--accent)')))));
  const label = () => [big ? '만들기' : '추가', ' ', icon('arrow-right', 18)];
  const buttons = [];
  const submit = async () => {
    if (!input.value.trim()) { input.focus(); return toast('사이트 주소를 넣어 주세요', true); }
    buttons.forEach((b) => { b.disabled = true; b.textContent = '확인 중…'; });
    try {
      const r = await api('POST', '/api/projects', { url: input.value, mode: modes.querySelector('input:checked')?.value ?? 'auto' });
      toast(r.existed ? `이미 등록된 사이트예요 (${r.name})` : `${r.name}(으)로 등록했어요`);
      sel = r.name; viewStage = null; adding = false;
      history.replaceState(null, '', `/p/${r.name}/`);
      await load();
    } catch (err) { toast(err.message, true); }
    finally { buttons.forEach((b) => { b.disabled = false; b.replaceChildren(...label()); }); }
  };
  const go = h('button', { class: 'go', type: 'submit' }, label()); buttons.push(go);
  const form = h('form', { class: 'start', onsubmit: (e) => { e.preventDefault(); submit(); } },
    h('div', { class: 'urlbox' }, ic('link', 22, 'var(--dim)'), input, go),
    h('div', { class: 'hint-line' }, icon('info', 14), 'https:// 없이 넣어도 돼요. 내 컴퓨터의 개발 서버(localhost:3000)도 돼요'),
    modes);
  if (big) { const cta = h('button', { class: 'go', type: 'button', onclick: submit }, label()); buttons.push(cta); return [form, h('div', { class: 'ctabar' }, cta)]; }
  return [form];
}

function envNotice() {
  if (!data.env.tools.length && data.env.chromium) return null;
  return h('div', { class: 'card2 envcard' }, h('b', { class: 'bad-text' }, '실행 환경을 먼저 준비해야 해요'),
    h('ul', { style: 'margin:0' }, data.env.tools.map((t) => h('li', {}, t)), !data.env.chromium && h('li', {}, '녹화용 브라우저: npx playwright install chromium')));
}

function render() {
  const root = $('#root');
  $('#recheck').hidden = !(data.env.tools.length || !data.env.chromium);
  if (!data.projects.length || adding) {
    topState(null);
    root.replaceChildren(h('div', { class: 'hero' },
      adding && data.projects.length ? h('button', { class: 'back', onclick: () => { adding = false; render(); } }, icon('arrow-left', 16), '진행 화면으로') : null,
      h('span', { class: 'kicker' }, '웹사이트 → 인스타그램 3:4 게시물'),
      h('h2', {}, 'URL만 넣으면', h('br'), '인스타그램 게시물이 나와요'),
      h('p', { class: 'sub' }, '페이지마다 캡처하고 배경을 다시 깔 필요 없어요. 1080×1440 영상·이미지 5~10개를 만들어 드려요.'),
      envNotice(), ...startForm(true),
      h('div', { class: 'flow' }, ['사이트 둘러보기', '녹화', '게시물 파일', '완성'].flatMap((s, i) => [i ? icon('chevron-right', 14) : null, h('span', {}, h('span', { class: 'n' }, String(i + 1)), s)]))));
    return;
  }
  if (!sel || !data.projects.find((p) => p.project === sel)) sel = data.projects[0].project;
  const p = data.projects.find((x) => x.project === sel);
  const pick = (name) => { sel = name; viewStage = null; history.replaceState(null, '', `/p/${name}/`); render(); };
  topState(p);
  root.replaceChildren(h('div', { class: `wrap${data.projects.length === 1 ? ' solo' : ''}` },
    h('aside', { class: 'list' },
      data.projects.map((x) => h('button', { class: `proj${x.project === sel ? ' sel' : ''}`, onclick: () => pick(x.project) },
        h('div', { class: 'row' }, h('b', {}, x.project), h('span', { class: 'grow' }), h('span', { class: 'hint' }, `${x.done}/${x.total}`)),
        h('span', { class: 'u' }, x.url.replace(/^https?:\/\//, '')),
        h('div', { class: 'bar' }, h('i', { style: `width:${(x.done / x.total) * 100}%` })),
        h('span', { class: `pill ${x.next === 'STOP' ? 'bad' : x.todo.who === 'me' ? 'warn' : x.todo.who === 'done' ? 'ok' : 'ai'}`, style: 'align-self:flex-start' }, x.next === 'STOP' ? '멈춤' : x.todo.who === 'me' ? '내 차례' : x.todo.who === 'done' ? '완성' : x.todo.since ? 'AI가 만드는 중' : 'AI 차례'))),
      h('details', { class: 'card', style: 'padding:12px' }, h('summary', { style: 'cursor:pointer' }, icon('plus', 14), ' 새 사이트'), h('div', { style: 'margin-top:10px' }, startForm(false)))),
    projectView(p, pick)));
}

function projectView(p, pick) {
  const switcher = data.projects.length > 1 && h('div', { class: 'projsel' }, h('select', { 'aria-label': '사이트 고르기', onchange: (e) => pick(e.target.value) }, data.projects.map((x) => h('option', { value: x.project, selected: x.project === p.project }, x.project))));
  const m = MODES[p.mode] ?? { title: '꼼꼼 모드 (녹화·완성본 승인)', icon: 'list-checks' };
  const other = p.mode === 'auto' ? 'edit' : 'auto';
  const working = p.todo.who === 'ai' && p.todo.since;
  const head = h('div', { class: 'head' },
    h('h2', {}, p.url.replace(/^https?:\/\//, '')),
    h('button', { class: 'modebadge', title: `진행 방식 · 눌러서 ${MODES[other].name}(으)로 바꾸기`, onclick: () => switchMode(p.project, other) }, icon(m.icon, 13), m.title, icon('chevrons-up-down', 13)),
    h('span', { class: 'grow' }),
    working ? h('span', { class: 'note' }, '창을 닫아도 계속 만들어요') : null,
    data.projects.length === 1 ? h('button', { class: 'newsite', onclick: () => { adding = true; render(); } }, icon('plus', 14), '새 사이트') : null);
  const parts = [switcher, head, envNotice()];
  if (p.next === 'DONE') parts.push(...doneView(p));
  else parts.push(progressCard(p), scenesCard(p), checksCard(p), workingTip(p));
  return h('section', { class: 'main' }, parts);
}

// ---- 진행 카드: 지금 할 일 + 단계 막대 ----
function progressCard(p) {
  const t = p.todo;
  const working = t.who === 'ai' && t.since;
  const elapsed = t.since ? Math.max(1, Math.round((Date.now() - Date.parse(t.since)) / 60000)) : null;
  const stages = p.stages.filter((s) => s.key !== 'env' || s.state !== 'done');
  const at = stages.findIndex((s) => s.state !== 'done' && !s.optional);
  const pos = at < 0 ? stages.length : at + 1;
  const stateOf = (s) => (working && s.state === 'now' ? 'working' : s.state === 'optional' ? 'todo' : s.state);
  const dot = (s, st) => h('span', { class: 'dot' }, st === 'done' ? icon('check', 15) : st === 'working' ? spinIcon(15) : st === 'stopped' ? icon('triangle-alert', 14) : String(stages.indexOf(s) + 1));
  const stText = { done: '완료', working: '진행 중', now: '지금', stopped: '멈춤', todo: '대기' };
  const titleIcon = p.next === 'STOP' ? ic('triangle-alert', 28, 'var(--bad)') : working ? spinIcon(28, 'var(--ai)') : t.who === 'me' ? ic('hand', 26, 'var(--accent-strong)') : ic('bot', 26, 'var(--ai)');
  const act = h('div', { class: 'todo2' },
    p.next === 'STOP' && t.detail ? h('div', { class: 'reason' }, t.detail) : t.detail && h('div', { class: 'detail' }, t.detail),
    t.say && [sayBox(t.say), h('div', { class: 'hint' }, '이 폴더에서 연 Claude Code 창에 붙여 넣어요. 또는 터미널에서 ', h('code', {}, `npx ai-url-to-feed ${p.url.replace(/^https?:\/\//, '')}`), '를 실행하면 Claude Code를 대신 띄워 끝까지 진행해요.')],
    (t.page || t.edit || t.link) && h('div', { class: 'actions' },
      t.editFirst && h('a', { class: 'btn', href: `/p/${p.project}/edit/` }, icon('sliders-horizontal', 18), '편집 화면에서 다듬기'),
      t.page && h('a', { class: `btn${t.editFirst ? ' ghost' : ''}`, href: `/p/${p.project}/${t.page}` }, icon(t.page === 'approve/plan' ? 'clapperboard' : 'images', 18), t.page === 'approve/plan' ? '녹화 확인하고 승인하기' : '완성본 확인하고 승인하기'),
      t.edit && !t.editFirst && h('a', { class: 'btn ghost', href: `/p/${p.project}/edit/` }, icon('sliders-horizontal', 18), '편집 화면에서 다듬기'),
      t.editFirst && h('a', { class: 'btn ghost', href: `/p/${p.project}/approve/plan` }, icon('film', 18), '녹화 원본 보기'),
      t.link && h('a', { class: 'btn ghost', href: `/${t.link}`, target: '_blank', rel: 'noopener' }, icon('life-buoy', 18), '문제 해결 보기')),
    (t.page && t.who === 'me') && h('div', { class: 'hint' }, '승인·거절은 화면에서 해도 되고, Claude Code에 말해도 돼요.'));
  return h('div', { class: 'card2' },
    h('div', { class: 'ptitle' }, titleIcon, h('h3', {}, t.text), h('span', { class: 'cnt' }, `${pos} / ${stages.length} 단계${elapsed ? ` · ${elapsed}분째` : ''}`)),
    t.activity && h('div', { class: 'activity' }, icon('activity', 15), t.activity),
    h('div', { class: `pbar${p.next === 'STOP' ? ' bad' : working ? ' ai' : ''}` }, h('i', { style: `width:${Math.max(4, ((pos - (working ? 0.5 : 1)) / stages.length) * 100)}%` })),
    h('div', { class: 'chips', style: `--n:${stages.length}`, role: 'list' }, stages.map((s) => {
      const st = stateOf(s);
      const sub = st === 'working' ? t.text : s.optional ? '선택' : s.checks.find((c) => c.detail)?.detail ?? (st === 'done' ? '완료' : STAGE_SUB[s.key] ?? '');
      return h('button', { class: `chip ${st}${viewStage === s.id ? ' view' : ''}`, role: 'listitem', title: '눌러서 체크 항목 보기', onclick: () => { viewStage = viewStage === s.id ? null : s.id; render(); } },
        dot(s, st), h('div', {}, h('b', {}, s.title), h('span', { class: 's' }, String(sub))), h('span', { class: 'st' }, stText[st]));
    })),
    act);
}

// ---- 지금까지 찍은 장면 ----
function scenesCard(p) {
  const working = p.todo.who === 'ai' && p.todo.since;
  if (!p.scenes?.length && !(working && p.current <= 3)) return null;
  const clock = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, '0')}`;
  const items = p.scenes?.length ? p.scenes.map((s) => h('div', { class: 'scene', title: s.text }, h('img', { src: s.thumb, alt: s.text, loading: 'lazy' }), h('span', { class: 't' }, clock(s.t)), h('span', { class: 'x' }, s.text.slice(0, 22))))
    : [0, 1, 2, 3].map(() => h('div', { class: 'scene' }, h('div', { class: 'sk' }, spinIcon(18, 'var(--ai)'))));
  return h('div', { class: 'card2' },
    h('div', { class: 'sec-h' }, icon('eye', 18), h('h4', {}, '지금까지 찍은 장면'), h('span', { class: 'grow' }), h('span', { class: 'note' }, p.scenes?.length ? '이 중에서 게시물을 만들어요' : '녹화가 끝나면 장면이 여기에 보여요')),
    h('div', { class: 'scenes' }, items));
}

function checksCard(p) {
  const s = p.stages.find((x) => x.id === viewStage);
  if (!s) return null;
  return h('div', { class: 'card2' }, h('div', { class: 'sec-h' }, h('h4', {}, `${s.id}. ${s.title} — 체크 항목`)),
    h('ul', { class: 'checks' }, s.checks.map((c) => h('li', {}, h('span', { class: `m${c.done ? ' y' : ''}` }, c.done ? icon('check', 12) : ''), h('span', {}, c.label), c.detail && h('span', { class: 'd' }, c.detail)))));
}

function workingTip(p) {
  if (p.todo.who !== 'ai') return null;
  return h('div', { class: 'tip' }, h('b', {}, 'Tip'), h('span', {}, p.todo.since ? 'Claude Code 창만 열어 두면 돼요. 끝나면 이 화면이 저절로 바뀌어요.' : '위 문장을 Claude Code에 붙여 넣으면 AI가 이어서 진행해요.'));
}

// ---- 완성 ----
function doneView(p) {
  const n = p.posts?.length ?? 0;
  const tweakEdit = async () => { if (p.mode === 'auto') { try { await api('POST', `/api/projects/${p.project}/mode`, { mode: 'edit' }); } catch (e) { return toast(e.message, true); } } location.href = `/p/${p.project}/edit/`; };
  const openFolder = async () => { await api('POST', `/api/projects/${p.project}/open-export`); toast('결과 폴더를 열었어요'); };
  return [
    h('div', { class: 'donehead' }, h('span', { class: 'okc' }, icon('check', 28)),
      h('div', {}, h('h3', {}, '완성됐어요'), h('div', { class: 's' }, `${p.url.replace(/^https?:\/\//, '')} · 게시물 ${n}개 · 1080×1440 · 자동 검사 모두 통과${p.usage ? ` · Claude Code 사용량 $${p.usage.cost_usd.toFixed(2)}` : ''}`)),
      h('span', { class: 'grow' }),
      h('div', { class: 'actions stickacts' },
        h('a', { class: 'btn ghost', href: `/p/${p.project}/approve/final` }, icon('images', 18), '게시물처럼 넘겨 보기'),
        h('button', { class: 'btn', onclick: openFolder }, icon('folder-open', 18), '결과 폴더 열기'))),
    n ? h('div', { class: 'card2' },
      h('div', { class: 'sec-h' }, h('h4', {}, '인스타그램에 올릴 순서'), h('span', { class: 'grow' }), h('span', { class: 'note' }, `01부터 차례로 올리면 돼요 · runs/${p.project}/export/`)),
      h('div', { class: 'posts' }, p.posts.map((a) => h('a', { class: 'post', href: `/p/${p.project}/approve/final#${a.n}`, title: a.scene },
        a.type === 'video' ? h('video', { class: 'm', src: a.file, muted: true, loop: true, autoplay: true, playsinline: true }) : h('img', { class: 'm', src: a.file, alt: a.scene, loading: 'lazy' }),
        h('span', { class: 'lbl' }, `${String(a.n).padStart(2, '0')} ${a.type === 'video' ? `영상 ${a.seconds}초` : '이미지'}`))))) : null,
    h('div', { class: 'tweak' }, h('span', { class: 'ti' }, ic('sliders-horizontal', 24, 'var(--accent)')),
      h('div', { style: 'display:flex;flex-direction:column;gap:2px;flex:1;min-width:220px' }, h('b', {}, '조금 바꾸고 싶나요?'), h('span', {}, '구간·재생 속도·배경색을 직접 고치거나, 마음에 안 드는 장면만 다시 찍을 수 있어요.')),
      h('a', { class: 'btn dark', href: `/p/${p.project}/approve/plan` }, icon('film', 18), '장면 다시 찍기'),
      h('button', { class: 'btn', onclick: tweakEdit }, icon('sliders-horizontal', 18), '편집 화면에서 다듬기')),
  ];
}

async function switchMode(project, mode) {
  try { await api('POST', `/api/projects/${project}/mode`, { mode }); toast(`${MODES[mode]?.name ?? mode}(으)로 바꿨어요`); await load(); }
  catch (e) { toast(e.message, true); }
}

async function load(recheck = false) {
  try { data = await api('GET', `/api/projects${recheck ? '?recheck=1' : ''}`); render(); }
  catch (e) { $('#root').replaceChildren(h('div', { class: 'empty bad-text' }, e.message)); }
}
$('.topbar h1').prepend(icon('clapperboard', 18), ' ');
$('#recheck').prepend(icon('refresh-cw', 14), ' ');
$('#help').prepend(icon('book-open', 14), ' ');
$('#recheck').addEventListener('click', async () => { await load(true); toast('다시 확인했어요'); });
await load();
// 3초마다 진행 상황을 새로 읽는다. 첫 화면(주소 입력)이거나 주소를 입력하는 중·새 사이트 칸을 연 동안은 화면을 다시 그리지 않는다
setInterval(() => { if (!document.querySelector('form input:focus, details[open], .hero')) load(); }, 3000);
</script>
</body>
</html>
