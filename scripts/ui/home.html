<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ai-url-to-feed</title>
<link rel="stylesheet" href="/ui/base.css">
<script src="/ui/lucide.js"></script>
<style>
  .wrap { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 12px; padding: 12px 16px 24px; max-width: 1440px; margin: 0 auto; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .proj { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .proj.sel { border-color: var(--text); box-shadow: inset 3px 0 0 var(--text); }
  .proj b { font-size: 13px; }
  .proj .u { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hero { max-width: 680px; margin: 10vh auto 0; text-align: center; display: flex; flex-direction: column; gap: 14px; padding: 0 16px; }
  .hero h2 { font-size: 26px; margin: 0; letter-spacing: -.5px; }
  .hero h2 b { background: var(--accent); padding: 0 6px; border-radius: 4px; }
  .urlform { display: flex; gap: 6px; }
  .urlform input { font-size: 15px; padding: 10px 12px; }
  .urlform button { padding: 0 18px; font-size: 14px; }
  .main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .head h2 { margin: 0; font: 700 16px ui-monospace, Menlo, monospace; }
  /* 7단계: 한 줄짜리 진행 막대 */
  .steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  @media (max-width: 900px) { .steps { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .step { background: none; border: 0; border-right: 1px solid var(--line); border-radius: 0; padding: 8px 10px; text-align: left; display: grid; grid-template-columns: 22px 1fr; gap: 0 8px; align-items: center; position: relative; }
  .step:last-child { border-right: 0; }
  .step .ic { grid-row: span 2; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; background: var(--panel-2); color: var(--dim); border: 1px solid var(--line); }
  .step .t { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step .w { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .step.done .ic { background: var(--ok); border-color: var(--ok); color: #fff; }
  .step.now { background: var(--text); }
  .step.now .t, .step.now .w { color: #fff; }
  .step.now .ic { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step.stopped { background: color-mix(in srgb, var(--bad) 10%, var(--panel)); box-shadow: inset 0 -3px 0 var(--bad); }
  .step.stopped .ic { background: var(--bad); border-color: var(--bad); color: #fff; }
  .step.optional .ic { border-style: dashed; background: none; }
  .step.working { background: var(--ai); }
  .step.working .t, .step.working .w { color: #fff; }
  .step.working .ic { background: #fff; border-color: #fff; color: var(--ai); }
  .spin { animation: spin 1.2s linear infinite; }
  .step.view { box-shadow: inset 0 -3px 0 var(--text); }
  .step:hover:not(.now):not(.working) { background: var(--panel-2); }
  .detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 12px; align-items: start; }
  @media (max-width: 900px) { .detail { grid-template-columns: 1fr; } }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: grid; grid-template-columns: 20px 1fr; gap: 0 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .checks li:last-child { border-bottom: 0; }
  .checks .m { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--panel-2); border: 1px solid var(--line); color: var(--dim); }
  .checks .m.y { background: var(--ok); border-color: var(--ok); color: #fff; }
  .checks .d { grid-column: 2; color: var(--dim); font-size: 11.5px; overflow-wrap: anywhere; }
  .nowcard .pb { display: flex; flex-direction: column; gap: 10px; }
  .nowcard .who { font-size: 12px; font-weight: 700; }
  .nowcard .who.me { color: var(--accent-strong); } .nowcard .who.ai { color: var(--ai); } .nowcard .who.done { color: var(--ok); }
  .nowcard .big { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .nowcard .reason { background: color-mix(in srgb, var(--bad) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad); border-radius: 6px; padding: 6px 10px; font-size: 12px; overflow-wrap: anywhere; }
  .nowcard .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .nowcard .actions a.btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 14px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; border: 1px solid var(--accent-strong); }
  .nowcard .actions a.btn.sub { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .tip { font-size: 11.5px; color: var(--dim); }
  /* 진행 방식 고르기 */
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; text-align: left; }
  .modes label { display: grid; grid-template-columns: 18px 1fr; gap: 0 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
  .modes label:has(input:checked) { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
  .modes input { margin: 3px 0 0; accent-color: var(--text); }
  .modes b { font-size: 13px; }
  .modes span { grid-column: 2; font-size: 11.5px; color: var(--dim); }
  details .modes { grid-template-columns: 1fr; }
  .modesel { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .modesel button { border: 0; border-radius: 0; padding: 3px 10px; font-size: 12px; background: var(--panel); color: var(--dim); }
  .modesel button + button { border-left: 1px solid var(--line); }
  .modesel button.on { background: var(--text); color: #fff; }
</style>
</head>
<body>
<div class="topbar">
  <h1>ai-url-to-feed</h1>
  <span class="hint">URL만 넣으면 인스타그램 3:4 영상·이미지</span>
  <span class="grow"></span>
  <button class="ghost" id="recheck" title="실행 환경과 사이트 응답을 다시 확인해요">다시 확인</button>
  <a id="help" href="https://github.com/tadkim/ai-url-to-feed#readme" target="_blank" rel="noopener">사용 방법</a>
</div>
<div id="root"></div>

<script type="module">
import { $, h, api, toast, sayBox, projectFromPath, icon } from '/ui/common.js';

let data = null;
let sel = projectFromPath();
let viewStage = null;   // 사용자가 눌러서 보고 있는 단계 (없으면 지금 단계)
const WHO_IC = { me: 'user', ai: 'bot', computer: 'monitor', done: 'circle-check' };
const WHO_TX = { me: '내 차례', ai: 'AI 차례', computer: '컴퓨터', done: '완료' };
const who = (w, size = 13) => [icon(WHO_IC[w], size), ' ', WHO_TX[w] ?? ''];
const STATE_IC = { done: 'check', now: 'circle-dot', stopped: 'triangle-alert' };
const spinIcon = (size) => { const el = icon('loader-circle', size); el?.classList.add('spin'); return el; };

const MODES = {
  auto: { name: '자동 생성', desc: 'URL만 넣으면 끝까지 자동으로 만들어요. 확인·승인 없음' },
  edit: { name: '편집 모드', desc: '자동으로 만든 뒤 내 취향대로 다듬고 한 번 승인해요' },
};
function modePicker() {
  const box = h('div', { class: 'modes', role: 'radiogroup', 'aria-label': '진행 방식' }, Object.entries(MODES).map(([k, m]) =>
    h('label', {}, h('input', { type: 'radio', name: 'mode', value: k, checked: k === 'auto' }), h('b', {}, m.name, k === 'auto' ? h('span', { class: 'hint', style: 'display:inline;margin-left:4px' }, '기본') : null), h('span', {}, m.desc))));
  box.value = () => box.querySelector('input:checked')?.value ?? 'auto';
  return box;
}
function urlForm(big) {
  // type=url은 https:// 없이 넣으면 브라우저가 막는다. 주소 앞부분은 서버가 붙인다
  const input = h('input', { type: 'text', inputmode: 'url', autocapitalize: 'off', autocomplete: 'url', spellcheck: 'false', placeholder: '내사이트.com', 'aria-label': '녹화할 웹사이트 주소 (https:// 없이 넣어도 돼요)', required: true });
  const label = () => [big ? '시작하기' : '추가', ' ', icon('arrow-right', 16)];
  const btn = h('button', { class: 'primary', type: 'submit' }, label());
  const picker = modePicker();
  const form = h('form', { class: 'urlform', onsubmit: async (e) => {
    e.preventDefault();
    btn.disabled = true; btn.textContent = '확인 중…';
    try {
      const r = await api('POST', '/api/projects', { url: input.value, mode: picker.value() });
      toast(r.existed ? `이미 등록된 사이트예요 (${r.name})` : `${r.name}(으)로 등록했어요`);
      sel = r.name; viewStage = null;
      history.replaceState(null, '', `/p/${r.name}/`);
      await load();
    } catch (err) { toast(err.message, true); }
    finally { btn.disabled = false; btn.replaceChildren(...label()); }
  } }, input, btn);
  return h('div', { style: 'display:flex;flex-direction:column;gap:8px' }, form, picker);
}

function render() {
  const root = $('#root');
  if (!data.projects.length) {
    root.replaceChildren(h('div', { class: 'hero' },
      h('h2', {}, h('b', {}, 'URL'), '만 넣으면, 인스타그램 게시물이 나와요'),
      h('p', { class: 'hint', style: 'font-size:14px;margin:0' }, '녹화할 웹사이트 주소를 넣어 주세요. https:// 없이 넣어도 돼요. 배포된 사이트도, 내 컴퓨터의 개발 서버(localhost:3000)도 돼요.'),
      urlForm(true),
      envNotice()));
    return;
  }
  if (!sel || !data.projects.find((p) => p.project === sel)) sel = data.projects[0].project;
  const p = data.projects.find((x) => x.project === sel);
  root.replaceChildren(h('div', { class: 'wrap' },
    h('aside', { class: 'list' },
      data.projects.map((x) => h('button', { class: `proj${x.project === sel ? ' sel' : ''}`, onclick: () => { sel = x.project; viewStage = null; history.replaceState(null, '', `/p/${x.project}/`); render(); } },
        h('div', { class: 'row' }, h('b', {}, x.project), h('span', { class: 'grow' }), h('span', { class: 'hint' }, `${x.done}/${x.total}`)),
        h('span', { class: 'u' }, x.url.replace(/^https?:\/\//, '')),
        h('div', { class: 'bar' }, h('i', { style: `width:${(x.done / x.total) * 100}%` })),
        h('span', { class: `pill ${x.next === 'STOP' ? 'bad' : x.todo.who === 'me' ? 'warn' : x.todo.who === 'done' ? 'ok' : 'ai'}`, style: 'align-self:flex-start' }, x.next === 'STOP' ? '멈춤' : x.todo.who === 'me' ? '내 차례' : x.todo.who === 'done' ? '완성' : x.todo.since ? 'AI가 만드는 중' : 'AI 차례'))),
      h('details', { class: 'card', style: 'padding:12px 14px' }, h('summary', { style: 'cursor:pointer' }, icon('plus', 14), ' 새 사이트'), h('div', { style: 'margin-top:10px' }, urlForm(false)))),
    projectView(p)));
}

function envNotice() {
  if (!data.env.tools.length && data.env.chromium) return null;
  return h('div', { class: 'card', style: 'text-align:left' }, h('b', { class: 'bad-text' }, '실행 환경을 먼저 준비해야 해요'),
    h('ul', {}, data.env.tools.map((t) => h('li', {}, t)), !data.env.chromium && h('li', {}, '녹화용 브라우저: npx playwright install chromium')));
}

function projectView(p) {
  const shown = p.stages.find((s) => s.id === (viewStage ?? p.current));
  const working = p.todo.who === 'ai' && p.todo.since;   // AI가 녹화하거나 파일을 만드는 중
  return h('section', { class: 'main' },
    h('div', { class: 'head' },
      h('h2', {}, p.project),
      h('a', { href: p.url, target: '_blank', rel: 'noopener', class: 'hint' }, p.url.replace(/^https?:\/\//, '')),
      h('span', { class: 'grow' }),
      h('span', { class: 'hint' }, '진행 방식'),
      h('div', { class: 'modesel', role: 'group', 'aria-label': '진행 방식' }, [...Object.entries(MODES), ...(p.mode === 'review' ? [['review', { name: '꼼꼼 모드' }]] : [])].map(([k, m]) =>
        h('button', { class: p.mode === k ? 'on' : '', title: m.desc ?? '녹화와 완성본을 둘 다 승인해요', onclick: () => switchMode(p.project, k) }, m.name))),
      h('span', { class: 'hint' }, `${p.done}/${p.total} 단계`),
      h('div', { class: 'bar', style: 'width:180px' }, h('i', { style: `width:${(p.done / p.total) * 100}%` }))),
    h('div', { class: 'steps', role: 'list' }, p.stages.map((s) => h('button', {
      class: `step ${s.state}${working && s.state === 'now' ? ' working' : ''}${viewStage === s.id ? ' view' : ''}`, role: 'listitem', 'aria-current': s.id === p.current ? 'step' : null,
      onclick: () => { viewStage = viewStage === s.id || s.id === p.current ? null : s.id; render(); },
    }, h('span', { class: 'ic' }, working && s.state === 'now' ? spinIcon(15) : STATE_IC[s.state] ? icon(STATE_IC[s.state], 15) : s.id), h('span', { class: 't' }, `${s.id}. ${s.title}`),
      h('span', { class: 'w' }, working && s.state === 'now' ? 'AI가 만드는 중' : s.state === 'now' ? [icon('arrow-left', 12), ' 지금 여기'] : s.state === 'stopped' ? '멈춤' : s.optional ? '선택' : who(s.who, 12))))),
    h('div', { class: 'detail' },
      h('div', { class: 'panel' }, h('div', { class: 'ph' }, h('h2', {}, `${shown.id}. ${shown.title}`), h('span', { class: 'hint' }, shown.id === p.current ? '지금 단계 · 체크 항목' : '체크 항목')),
        h('div', { class: 'pb' }, h('ul', { class: 'checks' }, shown.checks.map((c) => h('li', {}, h('span', { class: `m${c.done ? ' y' : ''}` }, c.done ? icon('check', 12) : ''), h('span', {}, c.label), c.detail && h('span', { class: 'd' }, c.detail)))))),
      todoCard(p)));
}

async function switchMode(project, mode) {
  try { await api('POST', `/api/projects/${project}/mode`, { mode }); toast(`${MODES[mode]?.name ?? mode}(으)로 바꿨어요`); await load(); }
  catch (e) { toast(e.message, true); }
}
function todoCard(p) {
  const t = p.todo;
  const elapsed = t.since ? Math.max(1, Math.round((Date.now() - Date.parse(t.since)) / 60000)) : null;
  return h('div', { class: 'panel nowcard' }, h('div', { class: 'ph' }, h('h2', {}, '지금 할 일'), h('span', { class: `who ${t.who}` }, who(t.who, 13))), h('div', { class: 'pb' },
    h('div', { class: 'big' }, t.who === 'ai' && t.since ? [spinIcon(18), ' '] : null, t.text, elapsed ? h('span', { class: 'hint' }, ` (${elapsed}분째)`) : null),
    p.next === 'STOP' && t.detail ? h('div', { class: 'reason' }, t.detail) : t.detail && h('div', { class: 'hint', style: 'overflow-wrap:anywhere' }, t.detail),
    t.say && [sayBox(t.say), h('div', { class: 'tip' }, '이 폴더에서 연 Claude Code 창에 붙여 넣어요. (터미널에서 ', h('code', {}, 'claude'), ' 실행)')],
    (t.page || t.edit || t.who === 'done' || t.link) && h('div', { class: 'actions' },
      t.editFirst && h('a', { class: 'btn', href: `/p/${p.project}/edit/` }, icon('sliders-horizontal', 16), ' 편집 화면에서 다듬기'),
      t.page && h('a', { class: `btn${t.editFirst ? ' sub' : ''}`, href: `/p/${p.project}/${t.page}` }, icon(t.page === 'approve/plan' ? 'clapperboard' : 'images', 16), ' ', t.page === 'approve/plan' ? '녹화 확인하고 승인하기' : '완성본 확인하고 승인하기'),
      t.edit && !t.editFirst && h('a', { class: 'btn sub', href: `/p/${p.project}/edit/` }, icon('sliders-horizontal', 16), ' 편집 화면에서 다듬기'),
      t.editFirst && h('a', { class: 'btn sub', href: `/p/${p.project}/approve/plan` }, icon('film', 16), ' 녹화 원본 보기'),
      t.who === 'done' && [
        h('button', { class: 'primary', onclick: async () => { await api('POST', `/api/projects/${p.project}/open-export`); toast('결과 폴더를 열었어요'); } }, icon('folder-open', 16), ' 결과 폴더 열기'),
        h('a', { class: 'btn sub', href: `/p/${p.project}/approve/final` }, icon('images', 16), ' 결과 보기'),
        t.mode === 'auto' && h('button', { onclick: () => switchMode(p.project, 'edit') }, icon('sliders-horizontal', 16), ' 편집 모드로 바꿔 다듬기')],
      t.link && h('a', { class: 'btn sub', href: `/${t.link}`, target: '_blank', rel: 'noopener' }, icon('life-buoy', 16), ' 문제 해결 보기')),
    (t.page && t.who === 'me') && h('div', { class: 'tip' }, '승인·거절은 화면에서 해도 되고, Claude Code에 말해도 돼요.')));
}

async function load(recheck = false) {
  try { data = await api('GET', `/api/projects${recheck ? '?recheck=1' : ''}`); render(); }
  catch (e) { $('#root').replaceChildren(h('div', { class: 'empty bad-text' }, e.message)); }
}
$('.topbar h1').prepend(icon('clapperboard', 18), ' ');
$('#recheck').prepend(icon('refresh-cw', 14), ' ');
$('#help').prepend(icon('book-open', 14), ' ');
$('#recheck').addEventListener('click', async () => { await load(true); toast('다시 확인했어요'); });
await load();
// 3초마다 진행 상황을 새로 읽는다. 첫 화면(주소 입력)이거나 주소를 입력하는 중·새 사이트 칸을 연 동안은 화면을 다시 그리지 않는다
setInterval(() => { if (!document.querySelector('form input:focus, details[open], .hero')) load(); }, 3000);
</script>
</body>
</html>
