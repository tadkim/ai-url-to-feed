<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>완성본 확인</title>
<link rel="stylesheet" href="/ui/base.css">
<script src="/ui/lucide.js"></script>
<style>
  main { max-width: 1440px; margin: 0 auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 8px; }
  .tabs { display: inline-flex; border: 1px solid #3f3f46; border-radius: 6px; padding: 2px; gap: 2px; }
  .tabs button { border: 0; background: none; border-radius: 4px; color: var(--bar-dim); padding: 3px 10px; font-size: 12px; }
  .tabs button.on { background: var(--bar-text); color: var(--bar); font-weight: 600; }
  .note { background: color-mix(in srgb, var(--warn) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  .note b { color: var(--warn); }
  .agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 540px), 1fr)); gap: 8px; }
  .asset { display: grid; grid-template-columns: minmax(0, 1fr) repeat(var(--cols), 170px); gap: 10px; align-items: start; padding: 10px 12px; }
  .asset.card { border-radius: 8px; }
  @media (max-width: 900px) { .asset { grid-template-columns: 1fr; } }
  .asset .info { display: flex; flex-direction: column; gap: 8px; }
  .asset .info { gap: 6px; }
  .asset .num { font: 700 16px ui-monospace, Menlo, monospace; }
  .asset .plan { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font-size: 12.5px; }
  .asset .plan .k { color: var(--dim); font-size: 11px; display: block; margin-bottom: 2px; }
  .asset figure { margin: 0; display: flex; flex-direction: column; gap: 6px; }
  .asset figcaption { font-size: 12px; color: var(--dim); display: flex; gap: 8px; }
  .asset figure.now figcaption b { color: var(--accent-strong); }
  .asset .changes { font-size: 12px; color: var(--warn); display: flex; flex-direction: column; gap: 2px; }
  .seen { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--dim); }
  .seen.on { color: var(--ok); }
  /* 넘겨 보기: 왼쪽 게시물 + 오른쪽 게시물 목록 */
  .viewer { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 24px; align-items: start; }
  .feed { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 8px 0; }
  .feed .nav { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); flex: none; }
  .feed .post { width: min(480px, 100%); background: #fff; border-radius: 12px; overflow: hidden; color: #222; border: 1px solid #e4e4e7; }
  .feed .post .ph { display: flex; gap: 8px; align-items: center; padding: 10px 12px; font-size: 14px; }
  .feed .post .ph i { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg,#f59e0b,#ec4899); }
  .feed .post .media-3x4 { border-radius: 0; }
  .feed .post .dots { display: flex; justify-content: center; gap: 5px; padding: 10px; }
  .feed .post .dots span { width: 7px; height: 7px; border-radius: 50%; background: #d4d4d8; }
  .feed .post .dots span.on { background: #3b82f6; }
  .alist { background: var(--panel); border: 1px solid #e4e4e7; border-radius: 16px; overflow: hidden; position: sticky; top: 62px; }
  .alist .lh { display: flex; align-items: center; gap: 8px; padding: 14px 16px; font-weight: 800; font-size: 16px; }
  .alist .it { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; border-top: 1px solid #f4f4f5; cursor: pointer; text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; border-radius: 0; width: 100%; }
  .alist .it.on { background: #f7fee7; }
  .alist .it img, .alist .it video { width: 42px; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 4px; background: #000; }
  .alist .it b { font-size: 13px; } .alist .it span { font-size: 12px; color: #71717a; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 230px; }
  .alist .it a { white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 8px; background: #09090b; color: #fafafa; font-size: 12px; font-weight: 700; text-decoration: none; }
  .alist .lf { padding: 14px 16px 16px; border-top: 1px solid #f4f4f5; }
  .alist .lf button { width: 100%; height: 46px; justify-content: center; display: inline-flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 800; border-radius: 12px; }
  .mobinfo { display: none; }
  @media (max-width: 900px) { .viewer { grid-template-columns: 1fr; } .alist { position: static; } }
  @media (max-width: 700px) {
    main { padding: 0 0 16px; gap: 0; } main > .row { display: none; } main > .note { margin: 8px 12px 0; padding: 6px 10px; }
    .topbar .tabs, .topbar #editLink { display: none; }
    .feed { padding: 12px 0 0; gap: 0; } .feed .nav { display: none; }
    .feed .post { width: calc(100% - 48px); border-radius: 10px; }
    .feed .post .ph { display: none; }
    .alist { display: none; }
    .mobinfo { display: flex; flex-direction: column; gap: 2px; padding: 10px 24px; }
    .mobinfo b { font-size: 14px; } .mobinfo span { font-size: 12px; color: #71717a; }
    .mobacts { display: flex; gap: 8px; padding: 10px 16px 14px; position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid #e4e4e7; }
    .mobacts a, .mobacts button { flex: 1; height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 12px; font-weight: 800; font-size: 14px; text-decoration: none; }
  }
  @media (min-width: 701px) { .mobacts { display: none; } }
  #back { display: inline-flex; align-items: center; color: var(--bar-text); margin-left: -6px; }
  .gate { display: flex; flex-wrap: wrap; gap: 6px; }
  .actionbar .reject { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .actionbar textarea { min-height: 34px; height: 34px; padding: 6px 8px; }
  .chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .chips button { padding: 1px 8px; border-radius: 4px; font-size: 11.5px; font-family: ui-monospace, Menlo, monospace; }
  .chips button.on { background: var(--warn); color: #fff; border-color: var(--warn); }
  .approve { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
</style>
</head>
<body>
<div class="topbar">
  <a id="back" href="/" aria-label="진행 화면으로" title="진행 화면으로"></a>
  <h1 id="title">완성본 확인</h1>
  <span class="grow"></span>
  <div class="tabs" role="tablist">
    <button id="tabFeed" class="on" role="tab">넘겨 보기</button>
    <button id="tabSide" role="tab" title="모든 게시물을 나란히, 이전 결과와 비교">한눈에 보기</button>
  </div>
  <a id="editLink" href="#">편집 화면에서 다듬기</a>
</div>
<main id="main"></main>
<div class="actionbar" id="bar"></div>

<script type="module">
import { $, h, api, toast, sayBox, projectFromPath, modal, nn, icon } from '/ui/common.js';
const P = projectFromPath();
let D = null;
let tab = 'feed';   // 기본은 인스타그램처럼 넘겨 보기
let feedAt = 0;
const seen = new Set();
const tagged = new Set();

const media = (src, type, attrs = {}) => !src ? h('div', { class: 'media-3x4 empty', style: 'display:grid;place-items:center' }, '파일 없음')
  : type === 'video' ? h('video', { class: 'media-3x4', src, muted: true, loop: true, playsinline: true, autoplay: true, ...attrs }) : h('img', { class: 'media-3x4', src, alt: '', ...attrs });

function markSeen(n) {
  if (seen.has(n)) return;
  seen.add(n); renderBar();
  document.querySelectorAll(`[data-seen="${n}"]`).forEach((c) => { c.classList.add('on'); c.replaceChildren(icon('eye', 13), ' 봤어요'); });
}

function sideView() {
  const prev = !!D.previous;
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) setTimeout(() => { if (e.target.isConnected) markSeen(Number(e.target.dataset.n)); }, 900); }), { threshold: 0.6 });
  const rows = D.assets.map((a) => {
    const ch = D.changes.assets[a.n] ?? [];
    const mismatch = a.planned && (a.planned.type !== a.type || a.planned.layout !== a.layout);
    const row = h('section', { class: 'card asset', style: `--cols:${prev ? 2 : 1}`, 'data-n': a.n },
      h('div', { class: 'info' },
        h('span', { class: 'num' }, nn(a.n)),
        h('span', { class: 'hint' }, a.type === 'video' ? `영상 · ${a.seconds}초` : `이미지 · 화면 ${{ single: 1, double: 2, triple: 3 }[a.layout] ?? '?'}개`),
        h('div', { class: 'plan' }, h('span', { class: 'k' }, '계획한 장면'), a.planned?.scene || a.scene || '—', mismatch ? h('div', { class: 'warn-text', style: 'margin-top:4px;font-size:12px' }, `계획은 ${a.planned.type}·${a.planned.layout}`) : null),
        ch.length ? h('div', { class: 'changes' }, h('b', {}, '이전과 달라진 점'), ch.map((c) => h('span', {}, `· ${c}`))) : null,
        h('span', { class: `seen${seen.has(a.n) ? ' on' : ''}`, 'data-seen': a.n }, icon('eye', 13), seen.has(a.n) ? ' 봤어요' : ' 아직 안 봤어요')),
      prev && h('figure', {}, media(a.previous, a.type), h('figcaption', {}, h('span', {}, '이전 (거절됨)'))),
      h('figure', { class: 'now' }, media(a.file, a.type), h('figcaption', {}, h('b', {}, '지금'), ch.length ? h('span', { class: 'warn-text' }, '바뀜') : prev ? h('span', {}, '그대로') : null)));
    io.observe(row);
    return row;
  });
  return rows;
}

function feedView() {
  const a = D.assets[feedAt];
  markSeen(a.n);
  const typ = (x) => (x.type === 'video' ? `영상 · ${x.seconds}초` : `이미지${x.layout && x.layout !== 'single' ? ` · 화면 ${{ double: 2, triple: 3 }[x.layout]}개` : ''}`);
  const scene = (x) => x.planned?.scene || x.scene || '';
  const editUrl = (x) => `/p/${P}/edit/?n=${x.n}`;
  const openFolder = async () => { await api('POST', `/api/projects/${P}/open-export`); toast('결과 폴더를 열었어요'); };
  const post = h('div', { class: 'post' }, h('div', { class: 'ph' }, h('i'), h('b', {}, P), h('span', { class: 'grow' }), h('span', { class: 'hint' }, `${feedAt + 1} / ${D.assets.length}`)),
    media(a.file, a.type),
    h('div', { class: 'dots' }, D.assets.map((_, i) => h('span', { class: i === feedAt ? 'on' : '' }))));
  // 모바일: 옆으로 밀어 넘기기
  let x0 = null;
  post.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  post.addEventListener('touchend', (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(dx < 0 ? 1 : -1); x0 = null; });
  return [h('div', { class: 'viewer' },
    h('div', {},
      h('div', { class: 'feed' },
        h('button', { class: 'nav', onclick: () => go(-1), disabled: feedAt === 0, 'aria-label': '이전 게시물' }, icon('chevron-left', 22)),
        post,
        h('button', { class: 'nav', onclick: () => go(1), disabled: feedAt === D.assets.length - 1, 'aria-label': '다음 게시물' }, icon('chevron-right', 22))),
      h('div', { class: 'mobinfo' }, h('b', {}, `${nn(a.n)}  ${typ(a)}`), h('span', {}, scene(a))),
      h('div', { class: 'mobacts' },
        h('a', { class: 'ghostbtn', href: editUrl(a), style: 'border:1px solid var(--line);color:var(--text);background:var(--panel)' }, icon('sliders-horizontal', 16), '이것만 다듬기'),
        h('button', { class: 'primary', onclick: openFolder }, icon('folder-open', 16), '폴더 열기'))),
    h('aside', { class: 'alist' },
      h('div', { class: 'lh' }, `게시물 ${D.assets.length}개`, h('span', { class: 'grow' }), D.gate && h('span', { class: `pill ${D.gate.results.some((r) => !r.pass) ? 'bad' : 'ok'}` }, D.gate.results.some((r) => !r.pass) ? '자동 검사 실패 있음' : '자동 검사 통과')),
      D.assets.map((x, i) => h('div', { class: `it${i === feedAt ? ' on' : ''}`, role: 'button', tabindex: 0, onclick: () => { feedAt = i; render(); } },
        x.type === 'video' ? h('video', { src: x.file, muted: true, preload: 'metadata' }) : h('img', { src: x.file, alt: '', loading: 'lazy' }),
        h('div', {}, h('b', {}, `${nn(x.n)}  ${typ(x)}`), h('span', {}, scene(x))),
        i === feedAt ? h('a', { href: editUrl(x), onclick: (e) => e.stopPropagation() }, icon('sliders-horizontal', 13), '다듬기') : h('span'))),
      h('div', { class: 'lf' }, h('button', { class: 'primary', onclick: openFolder }, icon('folder-open', 18), '결과 폴더 열기'))))];
}
function go(d) { feedAt = Math.max(0, Math.min(D.assets.length - 1, feedAt + d)); render(); }
document.addEventListener('keydown', (e) => { if (tab !== 'feed' || e.target.closest('textarea')) return; if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); });

function header() {
  const out = [];
  // 넘겨 보기는 게시물만 보여 준다. 검사 결과는 오른쪽 목록 머리에 있다
  if (tab === 'feed') {
    if (D.mode !== 'auto' && D.status.next !== 'APPROVAL_FINAL') out.push(h('div', { class: 'note' }, h('b', {}, '지금은 승인할 수 없어요'), ' — ', D.status.next === 'DONE' ? '이미 승인한 완성본이에요.' : D.status.reason));
    return out;
  }
  const fails = D.gate ? D.gate.results.filter((r) => !r.pass) : [];
  out.push(h('div', { class: 'row' },
    h('span', { class: `pill ${!D.gate ? '' : fails.length ? 'bad' : 'ok'}` }, !D.gate ? '자동 검사 전' : fails.length ? `자동 검사 ${fails.length}개 실패` : '자동 검사 모두 통과'),
    h('span', { class: 'hint' }, `파일 ${D.assets.length}개 · ${D.canvas.width}×${D.canvas.height}`),
    D.style && h('span', { class: 'hint', style: 'display:flex;gap:6px;align-items:center' }, '배경', h('span', { style: `width:14px;height:14px;border-radius:4px;background:${D.style.bg};border:1px solid var(--line)` }), D.style.bg)));
  if (D.previous) out.push(h('div', { class: 'note' }, h('b', {}, '지난번 요청'), ` "${D.previous.note ?? '(요청 없음)'}" 이후 다시 만든 결과예요.`,
    D.changes.style.length ? h('div', { style: 'margin-top:4px' }, '전체 스타일: ', D.changes.style.map((s) => `${s.key} ${s.from} → ${s.to}`).join(', ')) : null));
  if (D.mode === 'auto') out.push(h('div', { class: 'note' }, h('b', {}, '자동 생성'), D.status.next === 'DONE' ? ' — 승인 없이 완성된 결과예요. 다듬고 싶으면 ' : ' — 아직 만드는 중이에요. ', h('button', { style: 'padding:1px 8px;font-size:12px', onclick: async () => { try { await api('POST', `/api/projects/${P}/mode`, { mode: 'edit' }); toast('편집 모드로 바꿨어요'); location.href = `/p/${P}/edit/`; } catch (e) { toast(e.message, true); } } }, '편집 모드로 바꾸기')));
  else if (D.status.next !== 'APPROVAL_FINAL') out.push(h('div', { class: 'note' }, h('b', {}, '지금은 승인할 수 없어요'), ' — ', D.status.next === 'DONE' ? '이미 승인한 완성본이에요.' : D.status.reason));
  return out;
}

function render() {
  $('#editLink').hidden = tab === 'feed';   // 넘겨 보기에서는 목록의 "다듬기"로 연다
  $('#main').replaceChildren(...header(), ...(tab === 'side' ? [h('div', { class: 'agrid' }, sideView())] : feedView()));
  renderBar();
}

// 아래 막대는 한 번만 만들고(적던 요청이 지워지지 않게) 확인 수·버튼 상태만 바꾼다
const bar = {};
function buildBar() {
  bar.note = h('textarea', { placeholder: '고칠 점을 적어요. 예: 02 두 번째 화면은 4개가 다 들어간 뒤로', 'aria-label': '고칠 점' });
  bar.reject = h('button', { class: 'danger', onclick: async () => {
    const text = bar.note.value.trim();
    if (!text) return toast('무엇을 고칠지 적어 주세요', true);
    const full = tagged.size ? `${[...tagged].sort((x, y) => x - y).map(nn).join(', ')}: ${text}` : text;
    await decide('reject', { note: full });
  } }, icon('pencil-line', 15), ' 거절하고 요청하기');
  bar.approve = h('button', { class: 'primary', onclick: () => decide('approve', { hash: D.hash }) }, icon('check', 16), ' 완성본 승인');
  bar.count = h('span', { class: 'hint' });
  bar.chips = h('div', { class: 'chips' });
  $('#bar').replaceChildren(
    h('div', { class: 'reject' }, bar.chips, h('div', { class: 'row', style: 'flex-wrap:nowrap' }, bar.note, bar.reject)),
    h('div', { class: 'approve' }, bar.count, bar.approve));
}
function renderBar() {
  if (!bar.approve) buildBar();
  $('#bar').hidden = D.mode === 'auto';   // 자동 생성은 승인하지 않는다
  const can = D.status.next === 'APPROVAL_FINAL';
  const fails = D.gate ? D.gate.results.filter((r) => !r.pass).length : 1;
  const all = seen.size >= D.assets.length;
  bar.note.disabled = !can; bar.reject.disabled = !can;
  // 다 봤는지는 알려 주기만 하고 막지 않는다. 자동 검사 실패만 막는다
  bar.approve.disabled = !can || fails > 0;
  bar.count.textContent = `본 에셋 ${Math.min(seen.size, D.assets.length)}/${D.assets.length}${!can ? '' : fails > 0 ? ' · 검사 실패가 있으면 승인할 수 없어요' : !all ? ' · 넘겨 보기로 빠르게 훑어볼 수 있어요' : ''}`;
  if (bar.chips.childElementCount !== D.assets.length + 1) {
    bar.chips.replaceChildren(h('span', { class: 'hint' }, '고칠 에셋'), ...D.assets.map((a) => h('button', { class: tagged.has(a.n) ? 'on' : '', onclick: (e) => { tagged.has(a.n) ? tagged.delete(a.n) : tagged.add(a.n); e.target.classList.toggle('on'); } }, nn(a.n))));
  }
  bar.chips.querySelectorAll('button').forEach((b) => { b.disabled = !can; });
}

async function decide(action, body) {
  try {
    await api('POST', `/api/projects/${P}/${action}/final`, body);
    modal(action === 'approve' ? '완성본을 승인했어요' : '고칠 점을 기록했어요',
      h('p', { style: 'margin:0' }, action === 'approve' ? '이제 끝났어요. Claude Code에 아래 문장을 말하면 마무리 보고를 받아요.' : 'Claude Code에 아래 문장을 말하면 AI가 요청을 받아 다시 작업해요.'),
      sayBox(`${P} 이어서 해줘`),
      h('div', { class: 'row' }, h('span', { class: 'grow' }), h('a', { href: `/p/${P}/` }, '진행 화면으로')));
    await load();
  } catch (e) { toast(e.message, true); if (/새로고침/.test(e.message)) await load(); }
}

async function load() {
  D = await api('GET', `/api/projects/${P}/compare/final`);
  const want = Number(location.hash.slice(1));
  if (want) { const i = D.assets.findIndex((a) => a.n === want); if (i >= 0) feedAt = i; }
  const name = D.mode === 'auto' ? '결과 보기' : '완성본 확인';
  $('#title').textContent = `${name} · ${P}`;
  document.title = `${name} · ${P}`;
  render();
}
$('#back').href = `/p/${P}/`;
$('#back').append(icon('chevron-left', 20));
$('#editLink').href = `/p/${P}/edit/`;
$('#editLink').prepend(icon('sliders-horizontal', 15), ' ');
$('#tabSide').prepend(icon('columns-2', 14), ' ');
$('#tabFeed').prepend(icon('gallery-horizontal', 14), ' ');
$('#tabSide').onclick = () => { tab = 'side'; $('#tabSide').classList.add('on'); $('#tabFeed').classList.remove('on'); render(); };
$('#tabFeed').onclick = () => { tab = 'feed'; $('#tabFeed').classList.add('on'); $('#tabSide').classList.remove('on'); render(); };
load().catch((e) => $('#main').replaceChildren(h('div', { class: 'empty bad-text' }, e.message)));
</script>
</body>
</html>
