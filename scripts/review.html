<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>에셋 편집</title>
<script src="/ui/lucide.js"></script>
<style>
  :root {
    --ui-bg: #ebebed; --panel: #ffffff; --panel-2: #f4f4f5; --line: #d4d4d8; --line-2: #a1a1aa; --text: #09090b; --dim: #52525b;
  --accent: #c6f36b; --accent-ink: #09090b; --accent-strong: #3f6a00; --ok: #15803d; --bad: #c62828; --warn: #a15c00; --ai: #6d28d9;
    --bg: #B987FF; --border: #444444; --bw: 2px; --radius: 0px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ui-bg); color: var(--text); font: 14px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  button { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
  button:hover:not(:disabled) { border-color: var(--text); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 7px 18px; }
  button.ghost { background: none; border-color: transparent; color: var(--dim); }
  button.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
  button.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  button.icon { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=number], input[type=text], select { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 5px 8px; }
  input[type=number] { width: 76px; font-variant-numeric: tabular-nums; }
  input[type=color] { width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
  input[type=range] { accent-color: var(--accent-strong); }
  :focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  kbd { font: 11px ui-monospace, monospace; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; color: var(--text); background: var(--panel-2); }
  .hint { color: var(--dim); font-size: 12px; }
  .bad-text { color: var(--bad); } .ok-text { color: var(--ok); } .warn-text { color: var(--warn); }
  .grow { flex: 1; }
  .pill { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
  .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }

  /* 도움말 툴팁: ⓘ 위에 올리거나 Tab으로 가면 보인다 */
  .info { position: relative; display: inline-grid; place-items: center; color: var(--dim); cursor: help; vertical-align: middle; }
  .icon { display: inline-block; vertical-align: -3px; flex: none; }
  button .icon + span, button .icon { pointer-events: none; }
  .info::after { content: attr(data-tip); position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); width: max-content; max-width: 260px; padding: 8px 10px; border-radius: 8px; background: #000; color: #fff; font: 12px/1.5 -apple-system, "Apple SD Gothic Neo", sans-serif; white-space: normal; box-shadow: 0 6px 20px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .12s; z-index: 30; }
  .info:hover::after, .info:focus::after { opacity: 1; }

  /* 상단 바: 진행 화면으로 · 제목과 반영 상태 · 실행 취소 · 도움말 · 내보내기 */
  .topbar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--ui-bg); z-index: 20; flex-wrap: wrap; }
  .topbar h1 { font-size: 15px; margin: 0; }
  .export-wrap { position: relative; }
  .count { display: inline-grid; place-items: center; min-width: 18px; height: 18px; margin-left: 6px; padding: 0 5px; border-radius: 99px; background: var(--accent-ink); color: var(--accent); font-size: 11px; }
  .unsynced { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--warn); }
  .unsynced::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); }
  .synced { font-size: 12px; color: var(--ok); }
  /* 다른 화면과 같은 검정 상단 바 */
  .topbar { background: #111113; color: #fafafa; border-bottom: 0; padding: 6px 16px; }
  .topbar .hint { color: #a1a1aa; }
  .topbar a { color: var(--accent) !important; }
  .topbar button.ghost { color: #d4d4d8; }
  .topbar button.ghost:hover:not(:disabled) { color: #fff; border-color: #52525b; }
  .topbar .unsynced { color: #fbbf24; }
  .topbar .unsynced::before { background: #fbbf24; }
  .topbar .synced { color: #4ade80; }

  /* 처음 한 번 보이는 안내 말풍선 */
  .coach { position: absolute; right: 0; top: calc(100% + 12px); width: 300px; padding: 14px; border-radius: 12px; background: #fff; color: #111; box-shadow: 0 12px 32px rgba(0,0,0,.18); border: 1px solid var(--line); z-index: 40; font-size: 13px; }
  .coach::before { content: ""; position: absolute; right: 28px; top: -6px; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); }
  .coach b { display: block; margin-bottom: 4px; font-size: 14px; }
  .coach .row { justify-content: flex-end; margin-top: 10px; }
  .coach button { background: #111; color: #fff; border-color: #111; }

  /* 작업 공간: 왼쪽 게시물 순서 · 가운데 미리보기 · 오른쪽 설정 패널 · 아래 타임라인 */
  .workspace { display: grid; grid-template-columns: 196px minmax(380px, 1fr) 380px; grid-template-areas: "list stage panel" "list dock panel"; align-items: start; gap: 12px; padding: 12px 18px 40px; max-width: 1480px; margin: 0 auto; }
  @media (max-width: 1120px) { .workspace { grid-template-columns: 1fr; grid-template-areas: "list" "stage" "dock" "panel"; } .list { position: static !important; max-height: none !important; } .list .items { flex-direction: row !important; overflow-x: auto; } }
  .box { background: var(--panel); border-radius: 12px; }
  .box-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 8px; font-size: 13px; font-weight: 700; }

  .list { grid-area: list; position: sticky; top: 70px; align-self: start; max-height: calc(100vh - 86px); display: flex; flex-direction: column; }
  .list .items { display: flex; flex-direction: column; gap: 8px; padding: 0 10px 10px; overflow-y: auto; }
  .thumb { flex: none; cursor: pointer; border-radius: 10px; padding: 6px; border: 2px solid transparent; background: var(--panel-2); text-align: left; display: flex; gap: 8px; align-items: center; }
  .thumb.sel { border-color: var(--text); }
  .thumb .meta { display: flex; flex-direction: column; gap: 4px; font-size: 12px; min-width: 0; }
  .thumb .meta b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .thumb:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 2px; }
  /* 게시물 순서: 번호 아래 순서 바꾸기·삭제 */
  .thumb .ord { display: flex; gap: 2px; }
  .thumb .ord button { width: 24px; height: 22px; padding: 0; display: inline-grid; place-items: center; border-radius: 5px; background: var(--panel); }
  .thumb .ord button.del:hover:not(:disabled) { border-color: var(--bad); color: var(--bad); }
  .list .add { display: flex; gap: 6px; padding: 0 10px 12px; }
  .list .add button { flex: 1; padding: 6px 4px; font-size: 12px; }

  .stagebox { grid-area: stage; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; }
  .stagebox .toolbar { display: flex; align-items: center; gap: 10px; width: 100%; }
  .transport { display: flex; align-items: center; gap: 10px; }
  .time { font-variant-numeric: tabular-nums; font-size: 13px; }
  .time .dim { color: var(--dim); }

  .stage { position: relative; overflow: hidden; border-radius: 4px; }
  .canvas { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); }
  .slot { position: absolute; overflow: hidden; border-radius: var(--radius); box-shadow: 0 0 0 var(--bw) var(--border); background: #000; }
  .slot video { width: 100%; height: 100%; display: block; object-fit: fill; }
  .canvas > video.file, .canvas > img.file { width: 100%; height: 100%; display: block; }
  .stale { position: absolute; left: 8px; top: 8px; z-index: 2; }

  .panel { grid-area: panel; display: flex; flex-direction: column; min-width: 0; }
  .tabs { display: flex; gap: 2px; padding: 6px; margin: 10px 10px 0; background: var(--ui-bg); border-radius: 10px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 8px; padding: 6px 4px; color: var(--dim); }
  .tabs button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .tabs .dot { display: inline-block; width: 6px; height: 6px; margin-left: 4px; border-radius: 50%; background: var(--bad); vertical-align: middle; }
  .panel-body { padding: 4px 14px 16px; display: flex; flex-direction: column; }
  /* 도구 탭: 고른 도구의 설정만 보여 준다 (CapCut 하단 도구처럼) */
  .tools { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 6px; padding: 12px 12px 0; }
  .tools button { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 2px 8px; border: 0; border-radius: 10px; background: var(--panel-2); color: #3f3f46; font-size: 12px; font-weight: 700; position: relative; }
  .tools button.on { background: #09090b; color: #fafafa; }
  .tools button.on .icon { color: var(--accent); }
  .tools .dot { position: absolute; top: 6px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .phead { display: flex; flex-direction: column; gap: 2px; padding: 14px 0 4px; }
  #panelHead { padding: 14px 14px 0; } #panelHead:empty { display: none; }
  .phead strong { font-size: 16px; }
  .tipbox { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #f7fee7; border: 1px solid #d9f99d; font-size: 12px; color: #3f3f46; margin-top: 12px; }
  .tipbox b { color: var(--accent-strong); }
  .donebtn { display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; margin: 12px 14px 14px; border-radius: 12px; background: var(--accent); border: 1px solid var(--accent-strong); color: var(--accent-ink) !important; font-weight: 800; text-decoration: none; }
  .ai-req textarea { width: 100%; min-height: 80px; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; resize: vertical; }
  @media (max-width: 700px) {
    .topbar { padding: 6px 10px; gap: 6px; } .topbar #help, .topbar #syncState { display: none; }
    .topbar #undo, .topbar #redo { font-size: 0; padding: 4px 6px; } .topbar #undo .icon, .topbar #redo .icon { width: 18px; height: 18px; }
    .topbar h1 { font-size: 14px; }
    .workspace { display: flex; flex-direction: column; gap: 0; padding: 0 0 84px; }
    .box { border-radius: 0; }
    .stagebox { order: 1; padding: 10px 10px 6px; } .stagebox .toolbar { display: none; }
    .list { order: 2; width: 100%; min-width: 0; position: static !important; max-height: none !important; } .list .box-head { display: none; }
    .list .items { padding: 8px 10px; flex-direction: row !important; overflow-x: auto; min-width: 0; }
    .thumb { padding: 4px; flex-direction: column; gap: 4px; } .thumb .meta { align-items: center; } .thumb .meta .hint, .thumb [data-badge] { display: none; }
    .thumb:not(.sel) .ord { display: none; }   /* 휴대폰은 고른 게시물에만 순서·삭제 버튼 */
    .topbar #title { font-size: 14px; }
    .stagebox #transport { margin-top: -4px; }
    .list .add { display: none; }
    .dock { order: 3; padding: 0 12px 8px; } .dock .shortcuts, .dock details { display: none; }
    .panel { order: 4; }
    .tools { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: #111113; padding: 6px 6px 10px; gap: 2px; }
    .tools button { background: none; color: #a1a1aa; } .tools button.on { background: #27272a; color: #fafafa; }
    .donebtn { margin: 8px 14px 16px; }
  }
  .section { display: flex; flex-direction: column; gap: 8px; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: 0; }
  .section > .label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--dim); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row > .lbl { width: 60px; color: var(--dim); font-size: 12px; flex: none; }
  .seg { display: inline-flex; background: var(--ui-bg); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
  .seg button { border: 0; background: none; border-radius: 7px; padding: 4px 11px; color: var(--dim); }
  .seg button.on { background: var(--panel-2); color: var(--text); font-weight: 600; }
  .seg.chips button.on { background: var(--accent); color: var(--accent-ink); }
  .banner { border-radius: 8px; padding: 8px 12px; font-size: 13px; background: color-mix(in srgb, var(--warn) 12%, transparent); color: var(--warn); }
  .meter { height: 6px; background: var(--ui-bg); border-radius: 99px; overflow: hidden; flex: 1; min-width: 100px; }
  .meter > i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  .meter.over > i { background: var(--bad); }
  .gate { display: flex; flex-direction: column; }
  .gate .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .gate .item:last-child { border-bottom: 0; }
  .gate .item .d { grid-column: 1 / -1; color: var(--dim); font-size: 12px; }
  .seam { display: flex; gap: 8px; align-items: flex-end; }
  .seam figure { margin: 0; font-size: 11px; color: var(--dim); text-align: center; }
  .seam video { width: 72px; height: 128px; background: #000; display: block; border-radius: 4px; }
  .field { display: flex; gap: 8px; align-items: center; }
  .field input[type=text] { width: 84px; font-family: ui-monospace, monospace; }

  /* 아래 타임라인 */
  .dock { grid-area: dock; padding: 0 14px 14px; }
  .tl { position: relative; height: 48px; background: var(--ui-bg); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; touch-action: none; user-select: none; overflow: hidden; }
  .tl .range { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--accent) 45%, transparent); border-left: 5px solid var(--accent-strong); border-right: 5px solid var(--accent-strong); }
  .tl .scene { position: absolute; top: 0; height: 10px; width: 2px; margin-left: -1px; background: var(--warn); }
  .tl .head { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); pointer-events: none; }
  .tl-legend { display: flex; justify-content: space-between; gap: 8px; color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .trim-rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; margin-top: 10px; }
  @media (max-width: 1120px) { .trim-rows { grid-template-columns: 1fr; } }
  details summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 10px; }
  .sheet { max-width: 100%; margin-top: 8px; border-radius: 6px; }
  .shortcuts { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--dim); font-size: 11px; margin-top: 10px; }

  /* 도움말 패널 */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(380px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 50; padding: 18px 20px; overflow-y: auto; box-shadow: -12px 0 32px rgba(0,0,0,.15); }
  .drawer h2 { font-size: 16px; margin: 0 0 12px; }
  .drawer h3 { font-size: 13px; margin: 18px 0 8px; color: var(--dim); }
  .drawer ol { padding-left: 20px; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .drawer dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; margin: 0; align-items: center; font-size: 13px; }
  .drawer dd { margin: 0; color: var(--dim); }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.15); z-index: 45; }

  .empty { padding: 60px 20px; text-align: center; color: var(--dim); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 16px; font-size: 13px; z-index: 60; box-shadow: 0 8px 24px rgba(0,0,0,.15); }
  .toast.bad { border-color: var(--bad); }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1 id="title">에셋 편집</h1>
    <div class="hint" id="syncState"></div>
  </div>
  <div class="grow"></div>
  <button class="icon ghost" id="undo" title="실행 취소 (⌘Z)" aria-label="실행 취소"></button>
  <button class="icon ghost" id="redo" title="다시 실행 (⇧⌘Z)" aria-label="다시 실행"></button>
  <button class="icon ghost" id="help" title="사용 방법" aria-label="사용 방법 보기"></button>
  <div class="export-wrap" id="exportWrap">
    <button class="primary" id="build">내보내기</button>
  </div>
</div>
<div class="workspace" id="ws">
  <aside class="box list" aria-label="게시물 순서">
    <div class="box-head">게시물 순서 <span class="info" tabindex="0" data-tip="인스타그램에서 위에서부터(왼쪽으로 넘기는 순서) 보여요. 번호 아래 위·아래 버튼으로 순서를 바꾸고, 휴지통 버튼으로 뺄 수 있어요."></span><span class="grow"></span><span class="hint" id="countHint"></span></div>
    <div class="items" id="strip"></div>
    <div class="add" id="add"></div>
  </aside>
  <section class="box stagebox" aria-label="미리보기">
    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="보기 방식" id="viewTabs"></div>
      <span class="info" tabindex="0" data-tip="편집 미리보기: 원본 영상을 실제 배치대로 브라우저에서 보여 줘요. 내보낸 파일: 마지막으로 내보낸 mp4·png예요."></span>
      <span class="grow"></span>
      <span class="hint" id="viewHint"></span>
    </div>
    <div id="big"></div>
    <div class="transport" id="transport"></div>
  </section>
  <section class="box panel" aria-label="설정">
    <div class="phead" id="panelHead"></div>
    <div class="tabs" role="tablist" id="panelTabs"></div>
    <div class="panel-body" id="panel"></div>
  </section>
  <section class="box dock" aria-label="타임라인" id="dock"></section>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v; else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, ''); else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid);
  return el;
};
// 아이콘은 Lucide만 쓴다 (/ui/lucide.js). 이름은 lucide.dev의 kebab-case
function icon(name, size = 16) {
  const key = name.split('-').map((w) => w[0].toUpperCase() + w.slice(1)).join('');
  const node = window.lucide?.icons?.[key];
  if (!node) return null;
  const el = window.lucide.createElement(node);
  el.setAttribute('width', size); el.setAttribute('height', size); el.setAttribute('aria-hidden', 'true');
  el.classList.add('icon');
  return el;
}
const info = (tip) => h('span', { class: 'info', tabindex: '0', 'data-tip': tip, 'aria-label': tip }, icon('info', 14));
const r2 = (v) => Math.round(v * 100) / 100;
const nn = (n) => String(n).padStart(2, '0');
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const fmt = (s) => { s = Math.max(0, s || 0); const m = Math.floor(s / 60); return `${m}:${(s - m * 60).toFixed(1).padStart(4, '0')}`; };
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* 저장 불가 환경 */ } } };

// 자동 검사 이름과 설명
const GATES = {
  export_files: ['파일 규격', '1080×1440 크기, H.264·30fps 영상과 PNG 이미지인지 확인해요'],
  video_length: ['영상 길이', '영상이 너무 짧거나 최대 길이를 넘지 않는지 확인해요'],

const recOf = (name) => S.recordings.find((r) => r.name === name);
const rawUrl = (name) => { const r = recOf(name); return r ? `files/raw/${r.file}?v=${(r.sha || '').slice(0, 8)}` : ''; };
const seconds = (a) => r2((a.out - a.in) / (a.speed || 1));

const duplicates = () => { const seen = new Map(); const dup = new Set(); for (const a of E.assets) { const k = specKey(a); if (seen.has(k)) { dup.add(a.n); dup.add(seen.get(k)); } else seen.set(k, a.n); } return dup; };
// 파일에 아직 반영되지 않은 것: 수정·추가된 에셋 수 (전체 스타일이 바뀌면 모든 에셋이 수정됨이 된다)

}

async function api(method, url, body) {
  const res = await fetch(url, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function applyStyleVars() {

}

// 값이 바뀌면 조금 뒤 edits.json에 자동 저장한다 (파일에는 내보내기를 눌러야 반영된다).
// 0.8초 안에 이어진 변경은 실행 취소 한 번으로 묶는다
function changed({ structure = false } = {}) {
  const now = Date.now();
  if (now - history.last > 800 && history.stable) { history.undo.push(history.stable); history.redo = []; }
  history.last = now;
  savedAt = null; renderSync();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 350);
  if (structure) renderAll(); else refreshLive();
  renderUndo();
}
async function save() {
  try {
    S = { ...(await api('PUT', 'api/edits', E)), edits: undefined };
    history.stable = JSON.stringify(E);
    savedAt = new Date();
    renderTop(); refreshBadges(); renderPanelTabs();
    if (curTab() === 'check') renderPanel();
  } catch (e) { savedAt = 'fail'; renderSync(); toast(`편집 내용을 저장하지 못했어요: ${e.message}`, true); }
}
function restore(json) {
  E = JSON.parse(json);
  sel = Math.min(sel, E.assets.length - 1);
  applyStyleVars(); renderAll();
  clearTimeout(saveTimer); save(); renderUndo();
}
function undo() { if (!history.undo.length) return; history.redo.push(JSON.stringify(E)); restore(history.undo.pop()); }
function redo() { if (!history.redo.length) return; history.undo.push(JSON.stringify(E)); restore(history.redo.pop()); }
function renderUndo() { $('#undo').disabled = !history.undo.length; $('#redo').disabled = !history.redo.length; }

function stage(width, inner) {
  const k = width / S.canvas.width;
  const canvas = h('div', { class: 'canvas', style: `width:${S.canvas.width}px;height:${S.canvas.height}px;transform:scale(${k})` }, inner);
  return h('div', { class: 'stage', style: `width:${width}px;height:${Math.round(S.canvas.height * k)}px` }, canvas);
}
function liveSlots(a, { big = false } = {}) {
  const l = S.layouts[a.layout];
  return l.slots.map((s, i) => {
    const v = h('video', { muted: true, playsinline: true, preload: 'auto' });
    v.muted = true;
    if (a.type === 'video') { v.src = rawUrl(a.source); loopers.push({ v, a, big }); v.addEventListener('loadedmetadata', () => { v.currentTime = a.in; if (!(big && paused)) v.play().catch(() => {}); }, { once: true }); }
    else { const sh = a.shots[i]; v.src = rawUrl(sh.source); v.dataset.shot = i; v.addEventListener('loadedmetadata', () => { v.currentTime = sh.at; }, { once: true }); }
    return h('div', { class: 'slot', style: `left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px` }, v);
  });
}
function fileView(a) {
  const b = S.built[a.n];
  const src = `files/export/${b.file}?v=${b.hash}`;
  return a.type === 'video' ? h('video', { class: 'file', src, muted: true, loop: true, autoplay: true, playsinline: true }) : h('img', { class: 'file', src, alt: `${nn(a.n)} 내보낸 파일` });
}
setInterval(() => {
  if (scrub) return;
  for (const { v, a, big } of loopers) {
    if (!v.isConnected || v.readyState < 1) continue;
    if (big && paused) { if (!v.paused) v.pause(); continue; }
    if (v.currentTime < a.in - 0.08 || v.currentTime >= a.out) v.currentTime = a.in;
    if (v.playbackRate !== (a.speed || 1)) v.playbackRate = a.speed || 1;
    if (v.paused) v.play().catch(() => {});
  }
  const a = E?.assets[sel];
  const v = $('#big video');
  if (a?.type === 'video' && v && view === 'preview') {
    const d = recOf(a.source)?.duration;
    const head = $('.tl .head');
    if (head && d) head.style.left = `${(v.currentTime / d) * 100}%`;
    const t = $('#clock');
    if (t) t.replaceChildren(fmt((v.currentTime - a.in) / (a.speed || 1)), h('span', { class: 'dim' }, ` / ${fmt(seconds(a))}`));
  }
}, 33);

// ---- 게시물 순서 ----
function badge(a, dup) {

  const b = S.built[a.n];
  if (!b || !b.file) return h('span', { class: 'pill warn', title: '아직 파일로 내보내지 않았어요' }, '새 항목');
  return b.current ? h('span', { class: 'pill ok', title: '내보낸 파일이 지금 편집 내용과 같아요' }, '반영됨') : h('span', { class: 'pill warn', title: '고친 내용이 아직 파일에 반영되지 않았어요' }, '수정됨');
}
function renderStrip() {
  loopers = loopers.filter((l) => l.v.closest('#big'));
  const dup = duplicates();
  $('#strip').replaceChildren(...E.assets.map((a, i) => {
    const b = S.built[a.n];
    const useFile = b?.current && i !== sel;   // 반영된 파일이 있으면 가벼운 실제 파일을, 없으면 미리보기를 보여 준다
    const pick = () => { sel = i; view = 'preview'; tab = keepTab(i); renderAll(); };
    const act = (fn) => (e) => { e.stopPropagation(); fn(); };
    // 항목 안에 버튼(순서·삭제)이 있어 항목 자체는 button이 아니라 role=button으로 둔다
    return h('div', { class: `thumb${i === sel ? ' sel' : ''}`, role: 'button', tabindex: 0, 'aria-current': i === sel ? 'true' : null, 'aria-label': `${nn(a.n)} ${typeName(a)}`, onclick: pick, onkeydown: (e) => { if (e.target === e.currentTarget && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(); } } },
      stage(66, useFile ? fileView(a) : liveSlots(a)),
      h('div', { class: 'meta' }, h('b', {}, nn(a.n)),
        h('div', { class: 'ord', role: 'group', 'aria-label': `${nn(a.n)} 순서·삭제` },
          h('button', { onclick: act(() => moveAsset(i, -1)), disabled: i === 0, title: '순서 앞으로', 'aria-label': `${nn(a.n)} 순서 앞으로` }, icon('arrow-up', 13)),
          h('button', { onclick: act(() => moveAsset(i, 1)), disabled: i === E.assets.length - 1, title: '순서 뒤로', 'aria-label': `${nn(a.n)} 순서 뒤로` }, icon('arrow-down', 13)),
          h('button', { class: 'del', onclick: act(() => deleteAsset(i)), title: '삭제', 'aria-label': `${nn(a.n)} 삭제` }, icon('trash-2', 13))),
        h('span', { class: 'hint' }, a.type === 'video' ? `영상 ${fmt(seconds(a))}` : typeName(a)), h('span', { 'data-badge': a.n }, badge(a, dup))));
  }));
  const src = S.recordings[0]?.name;

    h('button', { disabled: !src, title: '맨 뒤에 영상 에셋을 추가해요', onclick: () => addAsset({ type: 'video', layout: 'single', source: src, in: 0, out: r2(Math.min(recOf(src).duration, 8)), speed: 1, loop: null }) }, icon('video', 14), ' 영상'),
    h('button', { disabled: !src, title: '맨 뒤에 이미지 에셋을 추가해요', onclick: () => addAsset({ type: 'image', layout: 'single', shots: [{ source: src, at: 0 }] }) }, icon('image', 14), ' 이미지'));
}
function refreshBadges() { const dup = duplicates(); for (const a of E.assets) { const el = $(`[data-badge="${a.n}"]`); if (el) el.replaceChildren(badge(a, dup)); } }
function renumber() { E.assets.forEach((a, i) => { a.n = i + 1; }); }
// 게시물 순서 목록의 순서 바꾸기·삭제 (선택한 항목은 따라간다)
function moveAsset(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= E.assets.length) return;
  [E.assets[i], E.assets[j]] = [E.assets[j], E.assets[i]];
  renumber();
  if (sel === i) sel = j; else if (sel === j) sel = i;

}
function deleteAsset(i) {

}

const TOOLS = {
  video: [['cut', 'scissors', '구간'], ['speed', 'gauge', '속도'], ['style', 'palette', '배경'], ['loop', 'repeat', '반복'], ['check', 'circle-check', '검사'], ['ai', 'wand-sparkles', 'AI에게']],

const toolsOf = (a) => TOOLS[a?.type === 'image' ? 'image' : 'video'].filter(([id]) => id !== 'ai' || inApp);
const inApp = /^\/p\/[^/]+\/edit\//.test(location.pathname);
function curTab() { const a = E.assets[sel]; const ids = toolsOf(a).map((t) => t[0]); return ids.includes(tab) ? tab : ids[0]; }
function keepTab(i) { const ids = toolsOf(E.assets[i]).map((t) => t[0]); return ids.includes(tab) ? tab : null; }
function renderPanelTabs() {
  const fails = S.gate ? S.gate.results.filter((r) => !r.pass && r.gate !== 'approval_final').length : 0;
  const tools = toolsOf(E.assets[sel]);
  const cur = curTab();

  $('#panelTabs').replaceChildren(...tools.map(([id, ic, label]) => h('button', { role: 'tab', 'aria-selected': String(cur === id), class: cur === id ? 'on' : '', onclick: () => { tab = id; renderPanelTabs(); renderPanel(); } },
    icon(ic, 20), label, id === 'check' && (fails > 0 || S.errors.length > 0) && h('span', { class: 'dot', 'aria-label': '확인 필요' }))));
}
const section = (label, tip, ...kids) => h('div', { class: 'section' }, h('div', { class: 'label' }, label, tip && info(tip)), kids);
function numInput(value, { step = 0.01, min = 0, max, label, onset }) {
  return h('input', { type: 'number', step, min, max, value, 'aria-label': label, oninput: (e) => { const v = Number(e.target.value); if (Number.isFinite(v) && e.target.value !== '') onset(v, e.target); } });
}
function sourceSelect(value, onset) {
  return h('select', { 'aria-label': '원본 영상', onchange: (e) => onset(e.target.value) }, S.recordings.map((r) => h('option', { value: r.name, selected: r.name === value }, `${r.name} (${fmt(r.duration)})`)));
}
const lcmOf = (a) => {
  const ms = (a.loop?.periods || []).map((p) => Math.round(p * 1000));
  if (!ms.length || ms.some((x) => !(x > 0))) return null;
  const g = (x, y) => (y ? g(y, x % y) : x);
  return ms.reduce((x, y) => (x / g(x, y)) * y) / 1000;
};

function videoPanel(a) {

    const n = h('input', { type: 'number', min: lo, max: hi, step: 1, value: s[key], 'aria-label': `${label} 값`, style: 'width:64px', oninput: (e) => { const v = Math.round(Number(e.target.value)); if (v >= lo && v <= hi) set(v, false); } });
    const set = (v, write = true) => { s[key] = v; r.value = v; if (write) n.value = v; applyStyleVars(); changed(); };
    return h('div', { class: 'row' }, h('span', { class: 'lbl' }, label), r, n, h('span', { class: 'hint' }, 'px'));
  };
  return [
    h('div', { class: 'section' }, h('div', { class: 'hint' }, '여기서 바꾼 값은 모든 에셋에 함께 적용돼요. 내보내면 모든 에셋이 다시 만들어져요.')),
    section('배경', '결과물과 잘 구분되는 색을 고르세요. 앱 화면과 비슷한 색이면 화면이 배경에 묻혀요.', color('bg', '배경색')),

    section('모서리', '화면 네 모서리를 둥글게 깎아요. 0이면 직각이에요.', num('radius', '둥글기', S.limits.radius)),
  ];
}

function checkView() {
  const out = [];
  if (S.errors.length) out.push(section('확인이 필요한 항목', '이 항목을 고쳐야 내보낼 수 있어요.', S.errors.map((e) => h('div', { class: 'bad-text', style: 'font-size:13px' }, e))));
  if (!S.gate) { out.push(h('div', { class: 'section hint' }, '아직 검사하지 않았어요. 내보내기를 누르면 파일을 만든 뒤 자동으로 검사해요.')); return out; }
  out.push(h('div', { class: 'section' }, S.gate.current ? h('div', { class: 'hint' }, `마지막 내보내기 결과예요 (${new Date(S.gate.measured_at).toTimeString().slice(0, 5)})`) : h('div', { class: 'banner' }, '이후에 고친 내용이 있어요. 아래는 이전 파일의 검사 결과예요. 내보내기를 누르면 다시 검사해요.')));
  out.push(h('div', { class: 'gate' }, S.gate.results.map((r) => {
    const [name, desc] = GATES[r.gate] ?? [r.gate, ''];
    const human = r.gate === 'approval_final';
    return h('div', { class: 'item' },
      h('span', {}, name, ' ', info(desc)),
      h('span', { class: r.pass ? 'ok-text' : human ? 'hint' : 'bad-text' }, r.pass ? '통과' : human ? '대기 중' : '실패'),
      !r.pass && h('div', { class: 'd' }, human ? `결과가 마음에 들면 완성본 확인 화면에서 승인해요 (Claude Code에 "${S.project} 완성본 승인"이라고 말해도 돼요)` : r.detail.join(' · ')));
  })));
  return out;
}

      h('div', { class: 'shortcuts' }, h('span', {}, h('kbd', {}, 'Space'), ' 재생/일시정지'), h('span', {}, h('kbd', {}, '←'), h('kbd', {}, '→'), ' 한 프레임'), h('span', {}, h('kbd', {}, 'I'), ' 시작 지점'), h('span', {}, h('kbd', {}, 'O'), ' 끝 지점'), h('span', {}, h('kbd', {}, '⌘Z'), ' 실행 취소')));

function videoDock(a) {
  const d = recOf(a.source).duration;
  const inI = numInput(a.in, { max: d, label: '시작 지점(초)', onset: (v) => setIn(v, false) });
  const outI = numInput(a.out, { max: d, label: '끝 지점(초)', onset: (v) => setOut(v, false) });
  const big = () => $('#big video');
  const setIn = (v, write = true) => { a.in = r2(clamp(v, 0, a.out - 0.1)); if (write) inI.value = a.in; const l = lcmOf(a); if (a.loop && l) { a.out = r2(Math.min(d, a.in + l)); outI.value = a.out; } const b = big(); if (b) b.currentTime = a.in; changed(); };
  const setOut = (v, write = true) => { a.out = r2(clamp(v, a.in + 0.1, d)); if (write) outI.value = a.out; const b = big(); if (b && (scrub || paused)) b.currentTime = a.out; changed(); };
  const step = (dir) => { const b = big(); if (!b) return; paused = true; renderTransport(); b.currentTime = clamp(b.currentTime + dir * frame(), 0, d); };
  keyHandlers = { i: () => setIn(big().currentTime), o: () => setOut(big().currentTime), ArrowLeft: () => step(-1), ArrowRight: () => step(1) };

  const tl = h('div', { class: 'tl', role: 'group', 'aria-label': '구간 타임라인' },
    h('div', { class: 'range' }),
    (recOf(a.source).scenes || []).map((t) => h('div', { class: 'scene', style: `left:${(t / d) * 100}%`, title: `화면 전환 ${fmt(t)}` })),
    h('div', { class: 'head' }));
  let drag = null;
  const at = (e) => { const r = tl.getBoundingClientRect(); return clamp(((e.clientX - r.left) / r.width) * d, 0, d); };
  tl.addEventListener('pointerdown', (e) => {
    const t = at(e), px = (x) => (Math.abs(x - t) / d) * tl.getBoundingClientRect().width;
    drag = px(a.in) < 12 ? 'in' : px(a.out) < 12 ? 'out' : 'seek';
    scrub = true; tl.setPointerCapture(e.pointerId); big()?.pause(); move(e);
  });
  const move = (e) => { if (!drag) return; const t = at(e); if (drag === 'in') setIn(t); else if (drag === 'out') setOut(t); else { const b = big(); if (b) b.currentTime = t; } };
  tl.addEventListener('pointermove', (e) => { const t = at(e), px = (x) => (Math.abs(x - t) / d) * tl.getBoundingClientRect().width; tl.style.cursor = drag ? tl.style.cursor : px(a.in) < 12 || px(a.out) < 12 ? 'ew-resize' : 'pointer'; move(e); });
  tl.addEventListener('pointerup', () => { drag = null; scrub = false; });
  const pointRow = (label, input, setter, cur, key) => h('div', { class: 'row' }, h('span', { class: 'lbl' }, label), input, h('span', { class: 'hint' }, '초'),
    h('button', { onclick: () => setter(cur() - frame()), 'aria-label': `${label} 한 프레임 앞으로` }, '−1프레임'), h('button', { onclick: () => setter(cur() + frame()), 'aria-label': `${label} 한 프레임 뒤로` }, '+1프레임'),
    h('button', { onclick: () => setter(big().currentTime), title: `재생 위치를 ${label}으로 (단축키 ${key})` }, '현재 위치로'));
  return [
    tl, h('div', { class: 'tl-legend' }, h('span', {}, '0:00.0'), h('span', {}, h('span', { style: 'color:var(--accent-strong)' }, '■'), ' 사용할 구간  ', h('span', { style: 'color:var(--warn)' }, '|'), ' 화면 전환  ', h('span', { style: 'color:var(--text)' }, '|'), ' 재생 위치'), h('span', {}, fmt(d))),
    h('div', { class: 'trim-rows' }, pointRow('시작 지점', inI, setIn, () => a.in, 'I'), pointRow('끝 지점', outI, setOut, () => a.out, 'O')),
  ];
}

function imageDock(a) {
  return a.shots.map((sh, i) => {
    const d = recOf(sh.source).duration;
    const n = numInput(sh.at, { max: d, label: `화면 ${i + 1} 장면 위치(초)`, onset: (v) => set(v, false) });
    const r = h('input', { type: 'range', min: 0, max: d, step: 0.01, value: sh.at, 'aria-label': `화면 ${i + 1} 장면 위치`, style: 'flex:1;min-width:200px', oninput: (e) => set(Number(e.target.value)) });
    const set = (v, write = true) => { sh.at = r2(clamp(v, 0, d)); r.value = sh.at; if (write) n.value = sh.at; changed(); };
    return h('div', { class: 'row', style: 'margin-bottom:6px' }, h('span', { class: 'lbl' }, `화면 ${i + 1}`), r, n, h('span', { class: 'hint' }, '초'),
      h('button', { onclick: () => set(sh.at - frame()), 'aria-label': '한 프레임 앞으로' }, '−1프레임'), h('button', { onclick: () => set(sh.at + frame()), 'aria-label': '한 프레임 뒤로' }, '+1프레임'));
  });
}

// ---- 값만 바뀌었을 때 화면 갱신 ----
function refreshLive() {
  const a = E.assets[sel];
  if (!a) return;
  const meta = $('.thumb[aria-current] .meta .hint');
  if (meta) meta.textContent = a.type === 'video' ? `영상 ${fmt(seconds(a))}` : typeName(a);
  if (a.type === 'video') {
    const d = recOf(a.source)?.duration || 1;
    const cr = $('#cutRange'); if (cr) cr.textContent = `${fmt(a.in)} ~ ${fmt(a.out)}`;
    const range = $('.tl .range');
    if (range) { range.style.left = `${(a.in / d) * 100}%`; range.style.width = `${((a.out - a.in) / d) * 100}%`; }
    const sec = seconds(a), max = S.limits.maxVideoSeconds, over = sec > max, under = sec < S.limits.minSeconds;
    const m = $('#lenMeter');
    if (m) { m.className = `meter${over ? ' over' : ''}`; m.firstChild.style.width = `${Math.min(100, (sec / max) * 100)}%`; }
    const len = $('#len');
    if (len) { len.textContent = `${fmt(sec)} / 최대 ${fmt(max)}${over ? ' 초과' : under ? ` · 최소 ${S.limits.minSeconds}초` : ''}`; len.className = `time ${over || under ? 'bad-text' : ''}`; }
    const sv = document.querySelectorAll('.seam video');
    if (sv.length === 2) { sv[0].currentTime = a.in; sv[1].currentTime = a.out; }
  } else {
    document.querySelectorAll('video[data-shot]').forEach((v) => { const sh = a.shots[Number(v.dataset.shot)]; if (sh && Math.abs(v.currentTime - sh.at) > 0.001) v.currentTime = sh.at; });
  }
}

function renderAll() { renderTop(); renderStrip(); renderStage(); renderPanelTabs(); renderPanel(); renderDock(); refreshLive(); renderUndo(); }

document.addEventListener('keydown', (e) => {
  if (!E || e.target.closest('input, select, textarea, .drawer')) return;
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') { e.preventDefault(); if (e.shiftKey) redo(); else undo(); return; }
  if (mod) return;
  if (e.key === ' ' && E.assets[sel]?.type === 'video' && view === 'preview') { e.preventDefault(); paused = !paused; renderTransport(); return; }
  const fn = keyHandlers[e.key] ?? keyHandlers[e.key.toLowerCase()];
  if (fn) { e.preventDefault(); fn(); }
});

$('#build').addEventListener('click', async () => {
  const btn = $('#build');
  btn.disabled = true; btn.dataset.busy = '1'; btn.replaceChildren('내보내는 중…');
  try {
    clearTimeout(saveTimer); await save();
    const r = await api('POST', 'api/build');
    S = { ...r.state, edits: undefined };
    if (r.export_code !== 0) { toast('내보내지 못했어요. 오른쪽 검사 도구를 확인해 주세요', true); tab = 'check'; }
    else if (r.judge_code === 0) toast('내보내기 완료 — 자동 검사를 모두 통과했어요');
    else { toast('내보내기 완료 — 자동 검사에 실패한 항목이 있어요', true); tab = 'check'; }
    view = 'file';
  } catch (e) { toast(e.message, true); } finally { delete btn.dataset.busy; renderAll(); }
});

(async () => {
  S = await api('GET', 'api/state');
  if (!S.edits) {
    $('#ws').replaceChildren(h('div', { class: 'empty', style: 'grid-column:1/-1' }, `아직 편집할 내용이 없어요. 하네스가 편집 단계를 마치면 여기서 고칠 수 있어요. (지금: ${S.status.reason})`));
    $('#build').disabled = true; $('#undo').disabled = true; $('#redo').disabled = true; $('#help').disabled = true;
    $('#title').textContent = `${S.title} — 에셋 편집`;
    return;
  }
  E = S.edits; E.style = { ...S.defaultStyle, ...E.style };
  // 결과 보기의 "다듬기"에서 넘어오면 그 게시물을 바로 고른다 (?n=번호)
  const want = Number(new URLSearchParams(location.search).get('n'));
  if (want) { const i = E.assets.findIndex((a) => a.n === want); if (i >= 0) sel = i; }
  history.stable = JSON.stringify(E);
  savedAt = new Date();
  applyStyleVars(); renderAll(); coach();
  // 시작 화면(npm start) 안에서 열었으면 진행 화면과 완성본 확인 화면으로 가는 길을 둔다
  if (/^\/p\/[^/]+\/edit\//.test(location.pathname)) {
    const base = location.pathname.replace(/edit\/.*$/, '');
    $('.topbar').prepend(h('a', { href: base, 'aria-label': '진행 화면으로', title: '진행 화면으로', style: 'display:inline-flex;color:#fafafa !important;margin-left:-4px' }, icon('chevron-left', 22)));
    $('.panel').append(h('a', { class: 'donebtn', href: `${base}approve/final` }, icon('check', 16), ' 다 됐어요 — 완성본 확인'));
  }
})().catch((e) => { document.body.append(h('div', { class: 'empty bad-text' }, e.message)); });
</script>
